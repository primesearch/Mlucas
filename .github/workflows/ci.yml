name: CI
on:
  push:
    branches:
      - main
  pull_request:
    # Skip the matrix for changes that cannot affect any build or test. pull_request only:
    # pushes to main and the monthly schedule always run everything. A denylist rather than
    # an allowlist, so an unrecognised new file type still runs CI rather than silently not.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - 'help.txt'
  schedule:
    - cron: '0 0 1 * *'

# One run per ref. A pull_request run is superseded the moment its branch is pushed again, but
# without a concurrency group the old run keeps its runners until it finishes on its own - and a run
# is 78 jobs and over 1700 runner-minutes, against a limit of 20 concurrent jobs for the whole
# organization, only 5 of which can be macOS. A queued job expires if it has not started within
# 24 hours, so runners held by a run nobody is waiting for are not just waste: they push live jobs
# past the point where they will ever start.
#
# Pushes to main and the monthly schedule are deliberately not cancelled - those runs are the record
# of what the branch does, and a later push should not erase an earlier result. Every other run gets
# a group of its own (github.run_id): in a shared group, a pending run is replaced by a newer one even
# without cancel-in-progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  Linux:
    name: Mlucas Linux

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04, ubuntu-22.04-arm, ubuntu-24.04-arm, ubuntu-26.04-arm]
        cc: [gcc, clang]
      fail-fast: false
    env:
      CC: ${{ matrix.cc }}
    steps:
    - uses: actions/checkout@v7
    - name: Install
      run: |
        sudo apt-get update -y
        sudo apt-get install -y libhwloc-dev
    - name: Before script
      run: |
        $CC --version
        if [[ $HOSTTYPE == aarch64 ]]; then
            $CC -dM -E -mcpu=native - </dev/null
        else
            $CC -dM -E -march=native - </dev/null
        fi
    - name: Script
      run: |
        set -x -o pipefail
        lscpu
        cat /proc/cpuinfo
        MODES=( '' NOSIMD )
        if [[ $HOSTTYPE == aarch64 ]]; then
            MODES+=( ASIMD )
        else
            MODES+=( SSE2 AVX AVX2 AVX512 )
            if echo 'int main(void){return 0;}' | $CC -march=knl -mavx512f -mavx512er -x c -o /dev/null -; then
                MODES+=( AVX512_KNL )
            else
                echo "::warning::Skipping the AVX512_KNL build mode as '$($CC --version | head -n1)' does not support -march=knl."
            fi
        fi
        for mode in "${MODES[@]}"; do
            echo -e "\n$mode\n"
            bash -e -o pipefail -- makemake.sh use_hwloc $mode
            (cd obj${mode:+_$mode}; make clean)
            for word in '' {{1..4},n}word; do
                echo -e "\nMfactor $word\n"
                bash -e -o pipefail -- makemake.sh mfac $word $mode
                (cd obj_mfac${word:+_$word}${mode:+_$mode}; make clean)
            done
        done
        cd obj
        echo -e '## Warnings\n```' >> $GITHUB_STEP_SUMMARY
        grep 'warning:' build.log | sed 's/\x1B\[\([0-9]\+\(;[0-9]\+\)*\)\?[mK]//g' | awk '{ print $NF }' | sort | uniq -c | sort -nr >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        # Ladder stops at 'm'. The 'l' self-test (FFT lengths 16M-60M) ran here on every push and
        # every pull request and was most of this job's self-test time; it now runs monthly against
        # main in selftest-large.yml, together with 'h', and on demand via its workflow_dispatch.
        # Self-test exit status: 1 = a wrong answer (residue mismatch, radix-set disagreement or a
        # zero residue); 2 = some FFT length had too few usable radix sets to test at all. Both used
        # to be 0, so no self-test regression could turn this job red. Everything except 0 and 2 is
        # a failure - that includes the statuses the self-test never returns, so a SIGSEGV or an
        # abort in the middle of the ladder cannot pass as a clean run. 2 stays tolerated until the
        # stock build stops failing every radix set at 1K and 2K; then this tightens to (( rc == 0 )).
        # The '|| st=${PIPESTATUS[0]}' is not optional: these steps run under set -e, so without it
        # the failing pipeline ends the step and the status is never examined at all.
        rc=0
        for s in tt t s m; do
            st=0
            time ./Mlucas -s $s -cpu "0:$(( $(nproc --all) - 1 ))" |& tee -a test.log || st=${PIPESTATUS[0]}
            if (( st != 0 && st != 2 )); then rc=1; fi
        done
        for s in tt t s; do
            st=0
            time ./Mlucas -prp -s $s -cpu "0:$(( $(nproc --all) - 1 ))" |& tee -a test.log || st=${PIPESTATUS[0]}
            if (( st != 0 && st != 2 )); then rc=1; fi
        done
        (( rc == 0 ))
        if [[ $HOSTTYPE == aarch64 ]]; then
            cd ../obj_NOSIMD
        fi
        bash -e -o pipefail -- ../config-fermat.sh -cpu "0:$(( $(nproc --all) - 1 ))"
        # Mfactor self-test on one build only. The explicit-ISA builds above are for compile
        # coverage: a runner may not be able to execute what they target.
        # On ARM the native build is ASIMD, whose trial-factoring routines are stubs -
        # twopmodq80.c's "No TF support on ARMv8!" lives under #ifdef USE_ARM_V8_SIMD - so run
        # the NOSIMD build there instead, which takes the scalar TF path and self-tests normally.
        # Same substitution config-fermat.sh already makes above, and the loop above has already
        # built these, so it costs no extra build time.
        if [[ $HOSTTYPE == aarch64 ]]; then mode=NOSIMD; else mode=; fi
        for word in '' {{1..4},n}word; do
            # M(521), not M(127): the 4-word build's 256-bit modpow needs p + 256 >= 512 to have a
            # lead chunk to work with, and asserts ("twopmodq256 : start_index < 2!") below that.
            # M(127) only ever passed because a stray -DTRYQ=4 sent that build down the single-word
            # path instead. 521 is the smallest Mersenne-prime exponent every word variant handles,
            # and costs slightly less than 127 did (726k trial divides vs 1.66M).
            (cd "../obj_mfac${word:+_$word}${mode:+_$mode}" && time "./Mfactor${word:+_$word}" -m 521 -bmax 20)
        done
    - name: Test
      run: |
        set -x -o pipefail
        CFLAGS=(-std=gnu99 -Wall -Wextra -g -O3)
        CPPFLAGS=(-D_GNU_SOURCE -DUSE_THREADS -DINCLUDE_GMP=0)
        mkdir obj_test_fft_radix
        cd obj_test_fft_radix
        $CC "${CFLAGS[@]}" "${CPPFLAGS[@]}" -c ../src/{Mlucas.c,br.c,dft_macro.c,fermat_mod_square.c,getRealTime.c,get_cpuid.c,get_fft_radices.c,get_fp_rnd_const.c,get_preferred_fft_radix.c,imul_macro.c,mers_mod_square.c,mi64.c,pair_square.c,pm1.c,qfloat.c,radix[0-9]*_ditN_cy_dif1.c,radix8_dif_dit_pass.c,radix16_dif_dit_pass.c,radix16_dyadic_square.c,radix16_wrapper_ini.c,radix16_wrapper_square.c,radix32_dif_dit_pass.c,radix32_dyadic_square.c,radix32_wrapper_ini.c,radix32_wrapper_square.c,rng_isaac.c,threadpool.c,twopmodq.c,twopmodq128.c,twopmodq192.c,twopmodq256.c,types.c} &>build.log
        $CC "${CFLAGS[@]}" "${CPPFLAGS[@]}" -c -DTEST_FFT_RADIX ../src/util.c &>>build.log
        mapfile -d '' files < <(printf '%s\0' ../src/radix[0-9]*_ditN_cy_dif1.c | sort -zV)
        for file in "${files[@]}"; do
            radix=${file##*/radix}
            radix=${radix%%_*}
            printf '\nTesting RADIX %s\n' "$radix"
            for ttype in 1 2 3; do
                printf '\n\tTTYPE %s\n\n' "$ttype"
                $CC "${CFLAGS[@]}" "${CPPFLAGS[@]}" -c -DRADIX="$radix" -DTTYPE="$ttype" ../src/test_fft_radix.c &>>build.log
                $CC "${CFLAGS[@]}" -o test_fft_radix *.o -lm -lpthread -lrt &>>build.log
                time ./test_fft_radix |& tee -a test_fft_radix.log | grep -i 'error\|warn\|assert\|test_fft_radix'
            done
        done
        rm -- *.o test_fft_radix
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: ${{ matrix.os }}_${{ matrix.cc }}_mlucas
        path: |
          obj*/build.log
          obj*/test.log
          obj*/mlucas.cfg
          obj*/config-fermat.log
          obj*/fermat.cfg
        if-no-files-found: warn

  Linux-32-bit:
    name: Mlucas Linux 32-bit

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-26.04-arm]
        cc: [gcc] # clang
      fail-fast: false
    env:
      CC: ${{ matrix.cc }}
    steps:
    - uses: actions/checkout@v7
    - name: Before script
      run: |
        sed -i 's/^MAX=29/MAX=28/' config-fermat.sh
    - name: Script
      run: |
        docker run --rm -i --platform "${{ endsWith(matrix.os, '-arm') && 'linux/arm/v7' || 'linux/386' }}" -v "$GITHUB_WORKSPACE:/workspace" -w /workspace -e CC=$CC debian:13 bash -s -e -o pipefail <<'EOF'
        apt-get update
        apt-get install -y build-essential libgmp-dev libhwloc-dev
        if [[ $CC == clang ]]; then
            apt-get install -y clang
        fi

        $CC --version

        for mode in '' NOSIMD; do
            echo -e "\n$mode\n"
            bash -e -o pipefail -- makemake.sh use_hwloc $mode
            (cd obj${mode:+_$mode}; make clean)
            for word in '' {{1..4},n}word; do
                echo -e "\nMfactor $word\n"
                bash -e -o pipefail -- makemake.sh mfac $word $mode
                (cd obj_mfac${word:+_$word}${mode:+_$mode}; make clean)
            done
        done
        cd obj
        for s in tt t s m; do time ./Mlucas -s $s -cpu "0:$(( $(nproc --all) - 1 ))"; done
        for s in tt t s; do time ./Mlucas -prp -s $s -cpu "0:$(( $(nproc --all) - 1 ))"; done
        bash -e -o pipefail -- ../config-fermat.sh -cpu "0:$(( $(nproc --all) - 1 ))"
        for word in '' {{1..4},n}word; do
            (cd "../obj_mfac${word:+_$word}" && time "./Mfactor${word:+_$word}" -m 521 -bmax 20)
        done
        EOF
    - uses: actions/upload-artifact@v7
      with:
        name: linux_${{ endsWith(matrix.os, '-arm') && 'arm' || 'x86' }}_${{ matrix.cc }}_mlucas
        path: |
          obj*/build.log
          obj*/test.log
          obj*/mlucas.cfg
          obj*/config-fermat.log
          obj*/fermat.cfg
        if-no-files-found: warn

  Linux-Singlethread:
    name: Mlucas Linux Singlethreaded

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-26.04-arm]
        cc: [gcc] # clang
      fail-fast: false
    env:
      CC: ${{ matrix.cc }}
    steps:
    - uses: actions/checkout@v7
    - name: Before script
      run: |
        sed -i 's/-DUSE_THREADS//; s/-lpthread//' makemake.sh
        sed -i 's/^MAX=29/MAX=28/' config-fermat.sh
        $CC --version
    - name: Script
      run: |
        set -x
        MODES=( '' NOSIMD )
        if [[ $HOSTTYPE == aarch64 ]]; then
            MODES+=( ASIMD )
        else
            MODES+=( SSE2 AVX AVX2 AVX512 )
            if echo 'int main(void){return 0;}' | $CC -march=knl -mavx512f -mavx512er -x c -o /dev/null -; then
                MODES+=( AVX512_KNL )
            else
                echo "::warning::Skipping the AVX512_KNL build mode as '$($CC --version | head -n1)' does not support -march=knl."
            fi
        fi
        for mode in "${MODES[@]}"; do
            echo -e "\n$mode\n"
            bash -e -o pipefail -- makemake.sh $mode
            (cd obj${mode:+_$mode}; make clean)
            for word in '' {{1..4},n}word; do
                echo -e "\nMfactor $word\n"
                bash -e -o pipefail -- makemake.sh mfac $word $mode
                (cd obj_mfac${word:+_$word}${mode:+_$mode}; make clean)
            done
        done
        cd obj
        # Self-test exit status: 1 = a wrong answer (residue mismatch, radix-set disagreement or a
        # zero residue); 2 = some FFT length had too few usable radix sets to test at all. Both used
        # to be 0, so no self-test regression could turn this job red. Everything except 0 and 2 is
        # a failure - that includes the statuses the self-test never returns, so a SIGSEGV or an
        # abort in the middle of the ladder cannot pass as a clean run. 2 stays tolerated until the
        # stock build stops failing every radix set at 1K and 2K; then this tightens to (( rc == 0 )).
        # The '|| st=${PIPESTATUS[0]}' is not optional: these steps run under set -e, so without it
        # the failing pipeline ends the step and the status is never examined at all.
        rc=0
        for s in tt t s m; do
            st=0
            time ./Mlucas -s $s || st=$?
            if (( st != 0 && st != 2 )); then rc=1; fi
        done
        for s in tt t s; do
            st=0
            time ./Mlucas -prp -s $s || st=$?
            if (( st != 0 && st != 2 )); then rc=1; fi
        done
        (( rc == 0 ))
        if [[ $HOSTTYPE == aarch64 ]]; then
            cd ../obj_NOSIMD
        fi
        bash -e -o pipefail -- ../config-fermat.sh
        # Mfactor self-test on one build only. The explicit-ISA builds above are for compile
        # coverage: a runner may not be able to execute what they target.
        # On ARM the native build is ASIMD, whose trial-factoring routines are stubs -
        # twopmodq80.c's "No TF support on ARMv8!" lives under #ifdef USE_ARM_V8_SIMD - so run
        # the NOSIMD build there instead, which takes the scalar TF path and self-tests normally.
        # Same substitution config-fermat.sh already makes above, and the loop above has already
        # built these, so it costs no extra build time.
        if [[ $HOSTTYPE == aarch64 ]]; then mode=NOSIMD; else mode=; fi
        for word in '' {{1..4},n}word; do
            (cd "../obj_mfac${word:+_$word}${mode:+_$mode}" && time "./Mfactor${word:+_$word}" -m 521 -bmax 20)
        done
    - name: Test
      run: |
        set -x -o pipefail
        CFLAGS=(-std=gnu99 -Wall -Wextra -g -O3)
        CPPFLAGS=(-D_GNU_SOURCE -DINCLUDE_GMP=0)
        mkdir obj_test_fft_radix
        cd obj_test_fft_radix
        $CC "${CFLAGS[@]}" "${CPPFLAGS[@]}" -c ../src/{Mlucas.c,br.c,dft_macro.c,fermat_mod_square.c,getRealTime.c,get_cpuid.c,get_fft_radices.c,get_fp_rnd_const.c,get_preferred_fft_radix.c,imul_macro.c,mers_mod_square.c,mi64.c,pair_square.c,pm1.c,qfloat.c,radix[0-9]*_ditN_cy_dif1.c,radix8_dif_dit_pass.c,radix16_dif_dit_pass.c,radix16_dyadic_square.c,radix16_wrapper_ini.c,radix16_wrapper_square.c,radix32_dif_dit_pass.c,radix32_dyadic_square.c,radix32_wrapper_ini.c,radix32_wrapper_square.c,rng_isaac.c,threadpool.c,twopmodq.c,twopmodq128.c,twopmodq192.c,twopmodq256.c,types.c} &>build.log
        $CC "${CFLAGS[@]}" "${CPPFLAGS[@]}" -c -DTEST_FFT_RADIX ../src/util.c &>>build.log
        mapfile -d '' files < <(printf '%s\0' ../src/radix[0-9]*_ditN_cy_dif1.c | sort -zV)
        for file in "${files[@]}"; do
            radix=${file##*/radix}
            radix=${radix%%_*}
            printf '\nTesting RADIX %s\n' "$radix"
            for ttype in 1 2 3; do
                printf '\n\tTTYPE %s\n\n' "$ttype"
                $CC "${CFLAGS[@]}" "${CPPFLAGS[@]}" -c -DRADIX="$radix" -DTTYPE="$ttype" ../src/test_fft_radix.c &>>build.log
                $CC "${CFLAGS[@]}" -o test_fft_radix *.o -lm &>>build.log
                time ./test_fft_radix |& tee -a test_fft_radix.log | grep -i 'error\|warn\|assert\|test_fft_radix'
            done
        done
        rm -- *.o test_fft_radix
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: ${{ matrix.os }}_${{ matrix.cc }}_singlethreaded_mlucas
        path: |
          obj*/build.log
          obj*/test.log
          obj*/mlucas.cfg
          obj*/config-fermat.log
          obj*/fermat.cfg
        if-no-files-found: warn

  Linux-old:
    name: Mlucas Linux old

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-26.04-arm]
        container: ["ubuntu:14.04", "ubuntu:16.04", "ubuntu:18.04", "ubuntu:20.04", "alpine:3.24"] # "ubuntu:12.04"
        cc: [gcc, clang]
        exclude:
          # Ubuntu 14.04's clang (3.4-era) predates AArch64 NEON 'v'-register asm syntax, so it
          # cannot assemble the inline asm in dft_macro.c on ARM ("unknown register name 'v0'").
          # Its gcc builds fine there, as do both compilers on x86-64, so drop only this one combo.
          - os: ubuntu-26.04-arm
            container: "ubuntu:14.04"
            cc: clang
      fail-fast: false
    env:
      CC: ${{ matrix.cc }}
    steps:
    - uses: actions/checkout@v7
    - name: Before script
      run: |
        sed -i 's/^MAX=29/MAX=25/' config-fermat.sh
    - name: Script
      run: |
        docker run --rm -i -v "$GITHUB_WORKSPACE:/workspace" -w /workspace -e CC=$CC "${{ matrix.container }}" ${{ startsWith(matrix.container, 'alpine:') && 'sh -c "apk add bash; exec bash -s"' || 'bash -s' }} <<'EOF'
        set -ex -o pipefail
        if [[ "${{ matrix.container }}" == ubuntu:* ]]; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential libgmp-dev libhwloc-dev
            HAVE_HWLOC=1
            if [[ $CC == clang ]]; then
                apt-get install -y clang
            fi
        elif [[ "${{ matrix.container }}" == alpine:* ]]; then
            apk update
            apk add build-base gmp-dev
            if apk add hwloc-dev; then
                HAVE_HWLOC=1
            fi
            if [[ $CC == clang ]]; then
                apk add clang
            fi
        fi

        $CC --version
        ldd --version || true

        MODES=( '' NOSIMD )
        if [[ $HOSTTYPE == aarch64 ]]; then
            MODES+=( ASIMD )
        else
            MODES+=( SSE2 AVX AVX2 )
            # Only test the AVX-512 build mode if the compiler's assembler can handle the AVX-512 constructs
            # Mlucas's kernels use: the extended registers (zmm16-31/xmm16-31/k0-7). Ancient clang can't -
            # clang 3.8 (ubuntu:16.04) rejects the extended register names ("unknown register name 'xmm30'").
            # (The one AVX-512ER instruction, vrcp28pd, lived in an unused mi64.c routine and is now gated to
            # KNL-only via __AVX512ER__, so plain AVX-512 builds no longer need an ER-capable assembler -
            # which is why clang 5.0 on alpine:3.8 can now build AVX-512.) Probe and skip AVX-512 rather than
            # fail the build on a mode that provably can't work here.
            if echo 'int main(void){__asm__ __volatile__("vpxord %%zmm31,%%zmm31,%%zmm31\n\tvmovq %%rax,%%xmm16\n\tvpmovzxbq %%xmm16,%%zmm16\n\tkmovw %%k1,%%eax":::"zmm31","xmm16","zmm16","k1","rax");return 0;}' | $CC -mavx512f -mavx512cd -mfma -x c -o /dev/null -; then
                MODES+=( AVX512 )
            else
                echo "::warning::Skipping the AVX512 build mode as the '$($CC --version | head -n1)' assembler cannot handle the required AVX512 extended registers (zmm16-31/xmm16-31/k0-7)."
            fi
            if echo 'int main(void){__asm__ __volatile__("vpxord %%zmm31,%%zmm31,%%zmm31\n\tvmovq %%rax,%%xmm16\n\tvpmovzxbq %%xmm16,%%zmm16\n\tkmovw %%k1,%%eax":::"zmm31","xmm16","zmm16","k1","rax");return 0;}' | $CC -march=knl -mavx512f -mavx512er -x c -o /dev/null -; then
                MODES+=( AVX512_KNL )
            else
                echo "::warning::Skipping the AVX512_KNL build mode as '$($CC --version | head -n1)' does not support -march=knl."
            fi
        fi
        for mode in "${MODES[@]}"; do
            echo -e "\n$mode\n"
            bash -e -o pipefail -- makemake.sh ${HAVE_HWLOC:+use_hwloc} $mode
            (cd obj${mode:+_$mode}; make clean)
            for word in '' {{1..4},n}word; do
                echo -e "\nMfactor $word\n"
                bash -e -o pipefail -- makemake.sh mfac $word $mode
                (cd obj_mfac${word:+_$word}${mode:+_$mode}; make clean)
            done
        done
        cd obj
        for s in tt t s; do time ./Mlucas -s $s -cpu "0:$(( $(nproc --all) - 1 ))"; done
        for s in tt t; do time ./Mlucas -prp -s $s -cpu "0:$(( $(nproc --all) - 1 ))"; done
        if [[ $HOSTTYPE == aarch64 ]]; then
            cd ../obj_NOSIMD
        fi
        bash -e -o pipefail -- ../config-fermat.sh -cpu "0:$(( $(nproc --all) - 1 ))"
        if [[ $HOSTTYPE == aarch64 ]]; then mode=NOSIMD; else mode=; fi
        for word in '' {{1..4},n}word; do
            (cd "../obj_mfac${word:+_$word}${mode:+_$mode}" && time "./Mfactor${word:+_$word}" -m 521 -bmax 20)
        done
        EOF
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: container-${{ strategy.job-index }}_${{ matrix.cc }}_mlucas
        path: |
          obj*/build.log
          obj*/test.log
          obj*/mlucas.cfg
          obj*/config-fermat.log
          obj*/fermat.cfg
        if-no-files-found: warn

  Linux-K1OM:
    name: Mlucas K1OM

    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Download
      run: |
          # https://web.archive.org/web/20210307201727/https://software.intel.com/content/www/us/en/develop/articles/intel-manycore-platform-software-stack-mpss.html
          wget -nv 'https://web.archive.org/web/20200818141734id_/http://registrationcenter-download.intel.com/akdlm/irc_nas/15904/mpss-3.8.6-linux.tar'
          tar -xvf mpss-3.8.6-linux.tar
    - name: Script
      run: |
        docker run --rm -i -v "$GITHUB_WORKSPACE:/workspace" -w /workspace centos:7 bash -s -e -o pipefail <<'EOF'
        sed -i '/^mirrorlist/d;/^#baseurl=/{s|^#||;s|/mirror|/vault|;}' /etc/yum.repos.d/CentOS*.repo
        # yum update -y
        yum install -y make
        yum localinstall -y mpss-3.8.6/mpss-sdk-k1om-3.8.6-1.x86_64.rpm
        source /opt/mpss/3.8.6/environment-setup-k1om-mpss-linux

        export CC=k1om-mpss-linux-gcc
        # unset CFLAGS CPPFLAGS
        $CC --version
        k1om-mpss-linux-ld --version
        $CC -dM -E - </dev/null

        bash -e -o pipefail -- makemake.sh no_gmp k1om
        (cd obj_k1om; make clean)
        for word in '' {{1..4},n}word; do
            echo -e "\nMfactor $word\n"
            bash -e -o pipefail -- makemake.sh no_gmp mfac $word k1om
            (cd obj_mfac${word:+_$word}_k1om; make clean)
