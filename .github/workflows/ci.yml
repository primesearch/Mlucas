        # now - status 2 currently fires on a stock build at FFT lengths 1K and 2K - and tighten
        # to (( rc == 0 )) once those are fixed.
        rc=0
        for s in tt t s m l; do
            time ./Mlucas -s $s -cpu "0:$(( NUMBER_OF_PROCESSORS - 1 ))" |& tee -a test.log
            st=${PIPESTATUS[0]}
            if (( st == 1 )); then rc=1; fi
        done
        for s in tt t s; do
            time ./Mlucas -prp -s $s -cpu "0:$(( NUMBER_OF_PROCESSORS - 1 ))" |& tee -a test.log
            st=${PIPESTATUS[0]}
            if (( st == 1 )); then rc=1; fi
        done
        (( rc == 0 ))
        if [[ $HOSTTYPE == aarch64 ]]; then
            cd ../obj_NOSIMD
        fi
        bash -e -o pipefail -- ../config-fermat.sh -cpu "0:$(( NUMBER_OF_PROCESSORS - 1 ))"
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: ${{ matrix.os }}_${{ matrix.cc }}_mlucas
        path: ${{ github.workspace }}

