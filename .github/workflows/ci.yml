        # abort in the middle of the ladder cannot pass as a clean run. 2 stays tolerated until the
        # stock build stops failing every radix set at 1K and 2K; then this tightens to (( rc == 0 )).
        # The '|| st=${PIPESTATUS[0]}' is not optional: these steps run under set -e, so without it
        # the failing pipeline ends the step and the status is never examined at all.
        rc=0
        for s in tt t s m; do
            st=0
            time ./Mlucas -s "$s" -cpu "0:$(( $(sysctl -n hw.ncpu) - 1 ))" | tee -a test.log || st=${PIPESTATUS[0]}
            if (( st != 0 && st != 2 )); then rc=1; fi
        done
        for s in tt t s; do
            st=0
            time ./Mlucas -prp -s "$s" -cpu "0:$(( $(sysctl -n hw.ncpu) - 1 ))" | tee -a test.log
            st=${PIPESTATUS[0]}
            if (( st == 1 )); then rc=1; fi
        done
        (( rc == 0 ))
        if [ "${{ matrix.arch }}" = aarch64 ]; then
            cd ../obj_NOSIMD
        fi
        bash -e -o pipefail -- ../config-fermat.sh -cpu "0:$(( $(sysctl -n hw.ncpu) - 1 ))"
        # Mfactor self-test on the native build only. The explicit-ISA builds above are for compile
        # coverage: this VM may not be able to execute what they target
        if [ "${{ matrix.arch }}" = aarch64 ]; then mode=NOSIMD; else mode=; fi
        for word in '' 1word 2word 3word 4word nword; do
            (cd "../obj_mfac${word:+_$word}${mode:+_$mode}" && time "./Mfactor${word:+_$word}" -m 521 -bmax 20)
        done
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: freebsd-${{ matrix.release }}_${{ matrix.arch }}_mlucas
        path: |
          obj*/build.log
          obj*/test.log
          obj*/mlucas.cfg
          obj*/config-fermat.log
          obj*/fermat.cfg
        if-no-files-found: warn

  Windows:
    name: Windows

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest]
        cc: [gcc, clang]
        include:
          - os: windows-11-arm
            cc: clang
      fail-fast: false
    env:
      CC: ${{ matrix.cc }}
      PREFIX: ${{ endsWith(matrix.os, '-arm') && 'clangarm64' || 'mingw64' }}
      PACKAGE_PREFIX: mingw-w64-${{ endsWith(matrix.os, '-arm') && 'clang-aarch64' || 'x86_64' }}-
    steps:
    - uses: actions/checkout@v7
    - name: Before Install
      run: |
        echo "C:\msys64\${env:PREFIX}\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        echo "C:\msys64\usr\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        echo "CPPFLAGS=-IC:\msys64\${env:PREFIX}\include" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        echo "LDFLAGS=-LC:\msys64\${env:PREFIX}\lib" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
    - name: Install
      run: |
        pacman -S --noconfirm "${env:PACKAGE_PREFIX}gmp" "${env:PACKAGE_PREFIX}hwloc"
        & $env:CC --version
    - name: Install Clang
      if: ${{ matrix.cc == 'clang' }}
      run: |
        pacman -S --noconfirm "${env:PACKAGE_PREFIX}clang"
    - name: Before script
      shell: bash
      run: |
        $CC --version
        if [[ "${{ matrix.os }}" == *-arm ]]; then
            $CC -dM -E -mcpu=native - </dev/null
        else
            $CC -dM -E -march=native - </dev/null
        fi
    - name: Script
      shell: bash
      run: |
        set -x
        MODES=( '' NOSIMD )
        if [[ "${{ matrix.os }}" == *-arm ]]; then
            MODES+=( ASIMD )
        else
            MODES+=( SSE2 AVX AVX2 AVX512 )
        fi
        for mode in "${MODES[@]}"; do
            echo -e "\n$mode\n"
            bash -e -o pipefail -- makemake.sh use_hwloc $mode
            (cd obj${mode:+_$mode}; make clean)
            for word in '' {{1..4},n}word; do
                echo -e "\nMfactor $word\n"
                bash -e -o pipefail -- makemake.sh mfac $word $mode
                (cd obj_mfac${word:+_$word}${mode:+_$mode}; make clean)
            done
        done
        cd obj
        # Ladder stops at 'm'; 'l' runs monthly against main in selftest-large.yml. See the note in
        # the Linux job above.
        # Self-test exit status: 1 = a wrong answer (residue mismatch, radix-set disagreement or a
        # zero residue); 2 = some FFT length had too few usable radix sets to test at all. Both used
        # to be 0, so no self-test regression could turn this job red. Everything except 0 and 2 is
        # a failure - that includes the statuses the self-test never returns, so a SIGSEGV or an
        # abort in the middle of the ladder cannot pass as a clean run. 2 stays tolerated until the
        # stock build stops failing every radix set at 1K and 2K; then this tightens to (( rc == 0 )).
        # The '|| st=${PIPESTATUS[0]}' is not optional: these steps run under set -e, so without it
        # the failing pipeline ends the step and the status is never examined at all.
        rc=0
        for s in tt t s m; do
            st=0
            time ./Mlucas -s $s -cpu "0:$(( NUMBER_OF_PROCESSORS - 1 ))" |& tee -a test.log || st=${PIPESTATUS[0]}
            if (( st != 0 && st != 2 )); then rc=1; fi
        done
        for s in tt t s; do
            st=0
            time ./Mlucas -prp -s $s -cpu "0:$(( NUMBER_OF_PROCESSORS - 1 ))" |& tee -a test.log || st=${PIPESTATUS[0]}
            if (( st != 0 && st != 2 )); then rc=1; fi
        done
        (( rc == 0 ))
        if [[ "${{ matrix.os }}" == *-arm ]]; then
            cd ../obj_NOSIMD
        fi
        bash -e -o pipefail -- ../config-fermat.sh -cpu "0:$(( NUMBER_OF_PROCESSORS - 1 ))"
        # Mfactor self-test on one build only. The explicit-ISA builds above are for compile
        # coverage; running them means executing a binary this runner may not support, which is
        # how the FreeBSD jobs came to SIGILL. Test the build matched to this host instead.
        # Same substitution config-fermat.sh already makes above, and the loop above has already
        # built these, so it costs no extra build time.
        if [[ "${{ matrix.os }}" == *-arm ]]; then mode=NOSIMD; else mode=; fi
        for word in '' {{1..4},n}word; do
            (cd "../obj_mfac${word:+_$word}${mode:+_$mode}" && time "./Mfactor${word:+_$word}" -m 521 -bmax 20)
        done
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: ${{ matrix.os }}_${{ matrix.cc }}_mlucas
        path: |
          obj*/build.log
          obj*/test.log
          obj*/mlucas.cfg
          obj*/config-fermat.log
          obj*/fermat.cfg
        if-no-files-found: warn

  ASan-Windows:
    name: AddressSanitizer Windows

    runs-on: windows-latest
    env:
      CC: clang
      PACKAGE_PREFIX: mingw-w64-clang-x86_64-
    steps:
    - uses: actions/checkout@v7
    - name: Before Install
      run: |
        echo "C:\msys64\clang64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        echo "C:\msys64\usr\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        echo "CPPFLAGS=-IC:\msys64\clang64\include" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        echo "LDFLAGS=-LC:\msys64\clang64\lib" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
    - name: Install
      run: |
        pacman -S --noconfirm "${env:PACKAGE_PREFIX}toolchain"
        pacman -S --noconfirm "${env:PACKAGE_PREFIX}gmp" "${env:PACKAGE_PREFIX}hwloc"
    - name: Before script
      shell: bash
      run: |
        sed -i 's/^CFLAGS = .*/CFLAGS = -std=gnu99 -Wall -Wextra -g -Og -fsanitize=address,undefined/' makemake.sh
        sed -i 's/^MAX=29/MAX=28/' config-fermat.sh
        $CC --version
    - name: Script
      shell: bash
      run: |
        set -x
        bash -e -o pipefail -- makemake.sh use_hwloc nosimd
        (cd obj_nosimd; make clean)
        for word in '' {{1..4},n}word; do
            echo -e "\nMfactor $word\n"
            bash -e -o pipefail -- makemake.sh mfac $word nosimd
            (cd obj_mfac${word:+_$word}_nosimd; make clean)
        done
        cd obj_nosimd
        # Self-test exit status: 1 = a wrong answer (residue mismatch, radix-set disagreement or a
        # zero residue); 2 = some FFT length had too few usable radix sets to test at all. Both used
        # to be 0, so no self-test regression could turn this job red. Everything except 0 and 2 is
        # a failure - that includes the statuses the self-test never returns, so a SIGSEGV or an
        # abort in the middle of the ladder cannot pass as a clean run. 2 stays tolerated until the
        # stock build stops failing every radix set at 1K and 2K; then this tightens to (( rc == 0 )).
        # The '|| st=${PIPESTATUS[0]}' is not optional: these steps run under set -e, so without it
        # the failing pipeline ends the step and the status is never examined at all.
        rc=0
        for s in tt t s m; do
            st=0
            time ./Mlucas -s $s -cpu "0:$(( NUMBER_OF_PROCESSORS - 1 ))" |& tee -a test.log || st=${PIPESTATUS[0]}
            if (( st != 0 && st != 2 )); then rc=1; fi
        done
        for s in tt t s; do
            st=0
            time ./Mlucas -prp -s $s -cpu "0:$(( NUMBER_OF_PROCESSORS - 1 ))" |& tee -a test.log || st=${PIPESTATUS[0]}
            if (( st != 0 && st != 2 )); then rc=1; fi
        done
        (( rc == 0 ))
        bash -e -o pipefail -- ../config-fermat.sh -cpu "0:$(( NUMBER_OF_PROCESSORS - 1 ))"
        for word in '' {{1..4},n}word; do
            (cd "../obj_mfac${word:+_$word}_nosimd" && time "./Mfactor${word:+_$word}" -m 521 -bmax 20)
        done
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: windows_asan_mlucas
        path: |
          obj*/build.log
          obj*/test.log
          obj*/mlucas.cfg
          obj*/config-fermat.log
          obj*/fermat.cfg
        if-no-files-found: warn
