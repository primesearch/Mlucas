          obj*/mlucas.cfg
          obj*/config-fermat.log
          obj*/fermat.cfg
        if-no-files-found: warn

  GCC-analyzer:
    name: GCC analyzer

    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: GCC analyzer
      run: |
        set -x -o pipefail
        gcc -c -fdiagnostics-color -std=gnu99 -g -O3 -DUSE_THREADS -fanalyzer src/*.c |& tee analyzer.log
        rm -- *.o
        echo -e '## GCC analyzer\n```' >> $GITHUB_STEP_SUMMARY
        grep 'warning:' analyzer.log | sed 's/\x1B\[\([0-9]\+\(;[0-9]\+\)*\)\?[mK]//g' | awk '{ print $NF }' | sort | uniq -c | sort -nr >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY

  Clang-Tidy:
    name: Clang-Tidy

    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install
      run: |
        sudo apt-get update -y
        sudo apt-get install -y libhwloc-dev
    - name: Clang-Tidy
      run: |
        set -x -o pipefail
        clang-tidy --use-color -checks='bugprone-*,-bugprone-reserved-identifier,cert-*,clang-analyzer-*,concurrency-*,misc-*,-misc-no-recursion,-misc-confusable-identifiers,performance-*,portability-*,readability-const-return-type,readability-container-*,readability-duplicate-include,readability-else-after-return,readability-make-member-function-cons,readability-non-const-parameter,readability-redundant-*,readability-simplify-*,readability-string-compare,readability-use-*' -header-filter='.*' src/*.c -- -std=gnu99 -Wall -Wextra -O3 -DUSE_THREADS -DINCLUDE_HWLOC=1 |& tee clang-tidy.log
        echo -e '## Clang-Tidy\n```' >> $GITHUB_STEP_SUMMARY
        grep 'warning:' clang-tidy.log | sed 's/\x1B\[\([0-9]\+\(;[0-9]\+\)*\)\?[mK]//g' | awk '{ print $NF }' | sort | uniq -c | sort -nr >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY

  Cppcheck:
    name: Cppcheck

    runs-on: ubuntu-22.04 # ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install
      run: |
        sudo apt-get update -y
        sudo apt-get install -y cppcheck libhwloc-dev
    - name: Cppcheck
      run: |
        mkdir build
        cppcheck --std=c99 --enable=all -DUSE_THREADS -DINCLUDE_HWLOC=1 --force --cppcheck-build-dir=build -j "$(nproc --all)" --clang .
        cppcheck --std=c99 --enable=all -DUSE_THREADS -DINCLUDE_HWLOC=1 --force --cppcheck-build-dir=build --clang . &> cppcheck.log
        echo -e '## Cppcheck\n```' >> $GITHUB_STEP_SUMMARY
        grep '\(error\|warning\|style\|performance\|portability\|information\):' cppcheck.log | awk '{ print $2, $NF }' | sort | uniq -c | sort -nr >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY

  ShellCheck:
    name: ShellCheck

    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: ShellCheck
      run: shellcheck --version; shopt -s globstar; shellcheck -o avoid-nullary-conditions,deprecate-which,quote-safe-variables,require-double-brackets -s bash **/*.sh

  macOS:
    name: Mlucas macOS

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-14, macos-15-intel, macos-15, macos-26-intel, macos-26]
      fail-fast: false
    steps:
    - uses: actions/checkout@v7
    - name: Install
      run: |
        brew install hwloc
    - name: Before script
      run: |
        clang --version
        if [[ $HOSTTYPE == arm64 ]]; then
            clang -dM -E -mcpu=native - </dev/null
        else
            clang -dM -E -march=native - </dev/null
        fi
    - name: Script
      run: |
        set -x -o pipefail
        sysctl -a
        MODES=( '' NOSIMD )
        if [[ $HOSTTYPE == arm64 ]]; then
            MODES+=( ASIMD )
        else
            MODES+=( SSE2 AVX AVX2 AVX512 )
        fi
        for mode in "${MODES[@]}"; do
            echo -e "\n$mode\n"
            bash -e -o pipefail -- makemake.sh use_hwloc $mode
            (cd obj${mode:+_$mode}; make clean)
            for word in '' {{1..4},n}word; do
                echo -e "\nMfactor $word\n"
                bash -e -o pipefail -- makemake.sh mfac $word $mode
                (cd obj_mfac${word:+_$word}${mode:+_$mode}; make clean)
            done
        done
        cd obj
        echo -e '## Warnings\n```' >> $GITHUB_STEP_SUMMARY
        grep 'warning:' build.log | sed 's/\x1B\[\([0-9]\+\(;[0-9]\+\)*\)\?[mK]//g' | grep -v '^ld:' | awk '{ print $NF }' | sort | uniq -c | sort -nr >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        # Ladder stops at 'm'; 'l' runs monthly against main in selftest-large.yml. See the note in
        # the Linux job above.
        # Self-test exit status: 1 = a wrong answer (residue mismatch, radix-set disagreement or a
        # zero residue); 2 = some FFT length had too few usable radix sets to test at all. Both used
        # to be 0, so no self-test regression could turn this job red. Everything except 0 and 2 is
        # a failure - that includes the statuses the self-test never returns, so a SIGSEGV or an
        # abort in the middle of the ladder cannot pass as a clean run. 2 stays tolerated until the
        # stock build stops failing every radix set at 1K and 2K; then this tightens to (( rc == 0 )).
        # The '|| st=${PIPESTATUS[0]}' is not optional: these steps run under set -e, so without it
        # the failing pipeline ends the step and the status is never examined at all.
        rc=0
        for s in tt t s m; do
            st=0
            time ./Mlucas -s $s -cpu "0:$(( $(sysctl -n hw.ncpu) - 1 ))" 2>&1 | tee -a test.log || st=${PIPESTATUS[0]}
            if (( st != 0 && st != 2 )); then rc=1; fi
        done
        for s in tt t s; do
            st=0
            time ./Mlucas -prp -s $s -cpu "0:$(( $(sysctl -n hw.ncpu) - 1 ))" 2>&1 | tee -a test.log || st=${PIPESTATUS[0]}
            if (( st != 0 && st != 2 )); then rc=1; fi
        done
        (( rc == 0 ))
        if [[ $HOSTTYPE == arm64 ]]; then
            cd ../obj_NOSIMD
        fi
        bash -e -o pipefail -- ../config-fermat.sh -cpu "0:$(( $(sysctl -n hw.ncpu) - 1 ))"
        # Mfactor self-test on one build only. The explicit-ISA builds above are for compile
        # coverage: a runner may not be able to execute what they target.
        # On ARM the native build is ASIMD, whose trial-factoring routines are stubs -
        # twopmodq80.c's "No TF support on ARMv8!" lives under #ifdef USE_ARM_V8_SIMD - so run
        # the NOSIMD build there instead, which takes the scalar TF path and self-tests normally.
        # Same substitution config-fermat.sh already makes above, and the loop above has already
        # built these, so it costs no extra build time.
        if [[ $HOSTTYPE == arm64 ]]; then mode=NOSIMD; else mode=; fi
        for word in '' {{1..4},n}word; do
            (cd "../obj_mfac${word:+_$word}${mode:+_$mode}" && time "./Mfactor${word:+_$word}" -m 521 -bmax 20)
        done
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: ${{ matrix.os }}_mlucas
        path: |
          obj*/build.log
          obj*/test.log
          obj*/mlucas.cfg
          obj*/config-fermat.log
          obj*/fermat.cfg
        if-no-files-found: warn

