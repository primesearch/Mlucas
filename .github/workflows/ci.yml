            for word in '' {{1..4},n}word; do
                echo -e "\nMfactor $word\n"
                bash -e -o pipefail -- makemake.sh mfac ${{ endsWith(matrix.os, '-arm') && 'no_gmp' || '' }} $word $mode
                (
                    cd obj_mfac${word:+_$word}${mode:+_$mode}
                    make clean
                    mv -v build.log build_${word}.log
                )
            done
        done
        cd obj
        # The self-test exit status is 1 if any case returned a wrong answer (residue mismatch,
        # radix-set disagreement or zero residue) and 2 if some FFT length had too few usable
        # radix sets to be tested at all - see help.txt. Both used to be status 0, and both were
        # additionally masked here by the pipe into tee, whose status is the one bash reports for
        # a pipeline; between them no self-test regression could turn this job red. Gate on 1 for
        # now - status 2 currently fires on a stock build at FFT lengths 1K and 2K - and tighten
        # to (( rc == 0 )) once those are fixed.
        # This job runs with pipefail set, so a self-test exiting 2 would propagate out of the pipe
        # into tee and, with set -e, end the step before the PIPESTATUS check below classifies it.
        # Turn pipefail off for the loop and take the self-test's own status from PIPESTATUS[0]:
        set +o pipefail
        rc=0
        for s in tt t s m l; do
            time ./Mlucas -s $s -cpu "0:$(( NUMBER_OF_PROCESSORS - 1 ))" |& tee -a test.log
            st=${PIPESTATUS[0]}
            if (( st != 0 && st != 2 )); then rc=1; fi
        done
        for s in tt t s; do
            time ./Mlucas -prp -s $s -cpu "0:$(( NUMBER_OF_PROCESSORS - 1 ))" |& tee -a test.log
            st=${PIPESTATUS[0]}
            if (( st != 0 && st != 2 )); then rc=1; fi
        done
        set -o pipefail
        (( rc == 0 ))
        if [[ $HOSTTYPE == aarch64 ]]; then
            cd ../obj_NOSIMD
        fi
        bash -e -o pipefail -- ../config-fermat.sh -cpu "0:$(( NUMBER_OF_PROCESSORS - 1 ))"
        # #222 gives each word-variant its own object directory, so the run enters one per variant
        # rather than cd-ing once for the whole sweep:
        mfac_mode=''
        [[ $HOSTTYPE == aarch64 ]] && mfac_mode=_NOSIMD
        for word in '' {{1..4},n}word; do
            ( cd "../obj_mfac${word:+_$word}$mfac_mode" && time ./Mfactor${word:+_$word} -m 127 -bmax 20 )
        done
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: ${{ matrix.os }}_${{ matrix.cc }}_mlucas
        path: ${{ github.workspace }}

