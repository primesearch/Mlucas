    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.code == 'true' }}
    name: Mlucas macOS

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-14, macos-15-intel, macos-15, macos-26]
      fail-fast: false
    steps:
    - uses: actions/checkout@v7
    - name: Install
      run: |
        brew install hwloc
    - name: Before script
      run: |
        clang --version
        if (( $(sysctl -n hw.optional.neon) )); then
            clang -dM -E -mcpu=native - </dev/null
        else
            clang -dM -E -march=native - </dev/null
        fi
    - name: Script
      run: |
        set -x
        set -o pipefail
        sysctl -a
        MODES=( '' NOSIMD )
        run_avx512=1
        if (( $(sysctl -n hw.optional.neon) )); then
            MODES+=( ASIMD )
        else
            MODES+=( SSE2 AVX AVX2 AVX512 )
            # GitHub runners can build AVX-512 but often cannot execute it (SIGILL at runtime). Probe
            # whether AVX-512 actually runs here; if not, skip running the AVX-512-mode test binaries
            # below (they are still built above, for compile coverage):
            if echo 'int main(void){__asm__ __volatile__("vpxord %%zmm0,%%zmm0,%%zmm0":::"zmm0");return 0;}' | ${CC:-cc} -mavx512f -x c -o conftest_avx512run - >/dev/null 2>&1 && ./conftest_avx512run >/dev/null 2>&1; then
                run_avx512=1
            else
                run_avx512=0
                echo "::warning title=AVX-512 execution skipped::this runner's CPU cannot execute AVX-512; AVX-512-mode test binaries were built but will not be run."
            fi
            rm -f conftest_avx512run
        fi
        for mode in "${MODES[@]}"; do
            echo -e "\n$mode\n"
            bash -e -o pipefail -- makemake.sh use_hwloc $mode
            (cd obj${mode:+_$mode}; make clean)
            for word in '' 1word 2word 3word 4word nword; do
                echo -e "\nMfactor $word\n"
                bash -e -o pipefail -- makemake.sh mfac $word $mode
                (
                    cd obj_mfac${mode:+_$mode}
                    make clean
                    mv -v build.log build_${word}.log
                    if [[ -x Mfactor${word:+_$word} ]]; then
                        if [[ "$mode" == AVX512 && "$run_avx512" == 0 ]]; then
                            echo "Skipping AVX-512 Mfactor${word:+_$word} run: this runner's CPU cannot execute AVX-512."
                        elif [[ $HOSTTYPE == aarch64 || $HOSTTYPE == arm64 ]]; then
                            # Mfactor trial-factoring (hence its test_fac self-test) is not supported on
                            # ARMv8 - it asserts "No TF support on ARMv8!" - so just smoke-test the binary.
                            ./Mfactor${word:+_$word} -h
                        else
                            # Exercise Mfactor's built-in self-tests (test_fac), which run during
                            # factoring-init and validate the modpow/sieve machinery. M(127) has no
                            # factors <= 2^20 so the trial-factoring pass is quick. Mfactor already
                            # exits nonzero on a test_fac failure, so no extra check is needed here.
                            ./Mfactor${word:+_$word} -m 127 -bmax 20
                        fi
                    fi
                )
            done
        done
        cd obj
        echo -e '## Warnings\n```' >> $GITHUB_STEP_SUMMARY
        grep 'warning:' build.log | sed 's/\x1B\[\([0-9]\+\(;[0-9]\+\)*\)\?[mK]//g' | grep -v '^ld:' | awk '{ print $NF }' | sort | uniq -c | sort -nr >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        # The self-test exit status is 1 if any case returned a wrong answer (residue mismatch,
        # radix-set disagreement or zero residue) and 2 if some FFT length had too few usable
        # radix sets to be tested at all - see help.txt. Both used to be status 0, and both were
        # additionally masked here by the pipe into tee, whose status is the one bash reports for
        # a pipeline; between them no self-test regression could turn this job red. Gate on 1 for
        # now - status 2 currently fires on a stock build at FFT lengths 1K and 2K - and tighten
        # to (( rc == 0 )) once those are fixed.
        rc=0
        for s in tt t s m l; do
            time ./Mlucas -s $s -cpu "0:$(( $(sysctl -n hw.ncpu) - 1 ))" 2>&1 | tee -a test.log
            st=${PIPESTATUS[0]}
            if (( st == 1 )); then rc=1; fi
        done
        for s in tt t s; do
            time ./Mlucas -prp -s $s -cpu "0:$(( $(sysctl -n hw.ncpu) - 1 ))" 2>&1 | tee -a test.log
            st=${PIPESTATUS[0]}
            if (( st == 1 )); then rc=1; fi
        done
        (( rc == 0 ))
        if (( $(sysctl -n hw.optional.neon) )); then
            cd ../obj_NOSIMD
        fi
        bash -e -o pipefail -- ../config-fermat.sh -cpu "0:$(( $(sysctl -n hw.ncpu) - 1 ))"
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: ${{ matrix.os }}_mlucas
        path: ${{ github.workspace }}

