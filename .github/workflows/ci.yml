name: CI
on:
  push:
    branches:
      - main
      - freebsd
  pull_request:
    # Skip the matrix for changes that cannot affect any build or test. pull_request only:
    # pushes to main and the monthly schedule always run everything. A denylist rather than
    # an allowlist, so an unrecognised new file type still runs CI rather than silently not.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - 'help.txt'
  schedule:
    - cron: '0 0 1 * *'

jobs:
  FreeBSD:
    name: Mlucas FreeBSD

    runs-on: ubuntu-latest
    strategy:
      matrix:
        release: [10, 11, 12, 13, 14, 15]
        arch: [x86_64, aarch64]
        exclude:
          - release: 10
            arch: aarch64
          - release: 11
            arch: aarch64
          - release: 12
            arch: aarch64
      fail-fast: false
    env:
      CC: clang
    steps:
    - uses: actions/checkout@v7
    - name: Script
      uses: vmactions/freebsd-vm@v1
      with:
        release: ${{ matrix.release }}
        arch: ${{ matrix.arch }}
        cpu: 4 # Defaults to 2 CPUs on aarch64
        envs: 'CC'
        usesh: true
        # sync: nfs
        prepare: |
          set -e
          case "${{ matrix.release }}" in
            1[01]) export SSL_NO_VERIFY_PEER=yes ;;
          esac
          pkg install -y bash gmp ${{ matrix.release == '10' && 'hwloc' || 'hwloc2' }}
    - name: Before script
      shell: freebsd {0} 
      run: |
        set -e # -o pipefail
        sed -i '' 's/^MAX=29/MAX=28/' config-fermat.sh
        $CC --version
        if [ "${{ matrix.arch }}" = aarch64 ]; then
            $CC -dM -E -mcpu=native - </dev/null
        else
            $CC -dM -E -march=native - </dev/null
        fi
    - name: Script
      shell: freebsd {0} 
      run: |
        set -ex # -o pipefail
        sysctl -a
        if [ "${{ matrix.arch }}" = aarch64 ]; then
            MODES='ASIMD'
        else
            MODES='SSE2 AVX AVX2'
            if echo 'int main(void){__asm__ __volatile__("vpxord %%zmm31,%%zmm31,%%zmm31\n\tvmovdqa64 %%xmm16,%%xmm17\n\tkmovw %%k1,%%eax":::"zmm31","xmm16","xmm17","k1","eax");return 0;}' | $CC -mavx512f -mavx512cd -mfma -x c -o /dev/null -; then
                MODES="$MODES AVX512"
            else
                echo "::warning::Skipping the AVX512 build mode as the '$($CC --version | head -n1)' assembler cannot handle the required AVX512 extended registers (zmm16-31/xmm16-31/k0-7)."
            fi
        fi
        for mode in '' NOSIMD $MODES; do
            echo -e "\n$mode\n"
            bash -e -o pipefail -- makemake.sh use_hwloc $mode
            (cd obj${mode:+_$mode}; make clean)
            for word in '' 1word 2word 3word 4word nword; do
                echo -e "\nMfactor $word\n"
                bash -e -o pipefail -- makemake.sh mfac $word $mode
                (cd obj_mfac${word:+_$word}${mode:+_$mode}; make clean)
            done
        done
        if [ "${{ matrix.arch }}" = aarch64 ]; then
            exit # ARM CPU emulation is too slow
        fi
        cd obj
        for s in tt t s m; do time ./Mlucas -s "$s" -cpu "0:$(( $(sysctl -n hw.ncpu) - 1 ))" | tee -a test.log; done
        for s in tt t s; do time ./Mlucas -prp -s "$s" -cpu "0:$(( $(sysctl -n hw.ncpu) - 1 ))" | tee -a test.log; done
        if [ "${{ matrix.arch }}" = aarch64 ]; then
            cd ../obj_NOSIMD
        fi
        bash -e -o pipefail -- ../config-fermat.sh -cpu "0:$(( $(sysctl -n hw.ncpu) - 1 ))"
        # Mfactor self-test on the native build only. The explicit-ISA builds above are for compile
        # coverage: this VM may not be able to execute what they target
        if [ "${{ matrix.arch }}" = aarch64 ]; then mode=NOSIMD; else mode=; fi
        for word in '' 1word 2word 3word 4word nword; do
            (cd "../obj_mfac${word:+_$word}${mode:+_$mode}" && time "./Mfactor${word:+_$word}" -m 521 -bmax 20)
        done
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: freebsd-${{ matrix.release }}-${{ matrix.arch }}-mlucas
        path: ${{ github.workspace }}
