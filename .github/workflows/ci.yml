    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: linux_k1om_mlucas
        path: |
          obj*/build.log
          obj*/test.log
          obj*/mlucas.cfg
          obj*/config-fermat.log
          obj*/fermat.cfg
        if-no-files-found: warn

  ASan-Linux:
    name: AddressSanitizer Linux

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-26.04-arm]
        cc: [gcc, clang]
      fail-fast: false
    env:
      CC: ${{ matrix.cc }}
    steps:
    - uses: actions/checkout@v7
    - name: Install
      run: |
        sudo apt-get update -y
        sudo apt-get install -y libhwloc-dev
    - name: Before script
      run: |
        sed -i 's/^CFLAGS = .*/CFLAGS = -std=gnu99 -Wall -Wextra -g -Og -fsanitize=address,undefined/' makemake.sh
        sed -i 's/^MAX=29/MAX=28/' config-fermat.sh
        $CC --version
    - name: Script
      run: |
        set -x -o pipefail
        # Build the runner's native SIMD mode under the sanitizers: AVX2 or AVX-512 on x86,
        # depending on the runner, and ASIMD on ARM. This is the only job that builds the
        # hand-tuned SIMD asm under a sanitizer. Issue #12, a SEGV in radix48_dit_pass1 during
        # 'Mlucas -s m', was reported by ASan on an ARM runner. (The macOS ASan job stays on
        # NOSIMD, see PR #71: there the SIMD asm fails to assemble under -Og, "invalid CFI
        # advance_loc expression".)
        bash -e -o pipefail -- makemake.sh use_hwloc
        (cd obj; make clean)
        # On ARM, config-fermat.sh runs from the NOSIMD build, as in the Linux job above: the ASIMD
        # build's trial-factoring routines are stubs ("No TF support on ARMv8!" in twopmodq80.c).
        if [[ $HOSTTYPE == aarch64 ]]; then
            bash -e -o pipefail -- makemake.sh use_hwloc nosimd
            (cd obj_nosimd; make clean)
        fi
        for word in '' {{1..4},n}word; do
            echo -e "\nMfactor $word\n"
            bash -e -o pipefail -- makemake.sh mfac $word nosimd
            (cd obj_mfac${word:+_$word}_nosimd; make clean)
        done
        cd obj
        # Self-test exit status: 1 = a wrong answer (residue mismatch, radix-set disagreement or a
        # zero residue); 2 = some FFT length had too few usable radix sets to test at all. Both used
        # to be 0, so no self-test regression could turn this job red. Everything except 0 and 2 is
        # a failure - that includes the statuses the self-test never returns, so a SIGSEGV or an
        # abort in the middle of the ladder cannot pass as a clean run. 2 stays tolerated until the
        # stock build stops failing every radix set at 1K and 2K; then this tightens to (( rc == 0 )).
        # The '|| st=${PIPESTATUS[0]}' is not optional: these steps run under set -e, so without it
        # the failing pipeline ends the step and the status is never examined at all.
        rc=0
        for s in tt t s m; do
            st=0
            time ./Mlucas -s $s -cpu "0:$(( $(nproc --all) - 1 ))" |& tee -a test.log || st=${PIPESTATUS[0]}
            if (( st != 0 && st != 2 )); then rc=1; fi
        done
        for s in tt t s; do
            st=0
            time ./Mlucas -prp -s $s -cpu "0:$(( $(nproc --all) - 1 ))" |& tee -a test.log || st=${PIPESTATUS[0]}
            if (( st != 0 && st != 2 )); then rc=1; fi
        done
        (( rc == 0 ))
        if [[ $HOSTTYPE == aarch64 ]]; then
            cd ../obj_nosimd
        fi
        bash -e -o pipefail -- ../config-fermat.sh -cpu "0:$(( $(nproc --all) - 1 ))"
        for word in '' {{1..4},n}word; do
            (cd "../obj_mfac${word:+_$word}_nosimd" && time "./Mfactor${word:+_$word}" -m 521 -bmax 20)
        done
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: ${{ matrix.os }}_${{ matrix.cc }}_asan_mlucas
        path: |
          obj*/build.log
          obj*/test.log
          obj*/mlucas.cfg
          obj*/config-fermat.log
          obj*/fermat.cfg
        if-no-files-found: warn

  TSan-Linux:
    name: ThreadSanitizer Linux

    runs-on: ubuntu-latest
    strategy:
      matrix:
        cc: [gcc, clang]
        exclude:
          - cc: gcc # Too slow
      fail-fast: false
    env:
      CC: ${{ matrix.cc }}
    steps:
    - uses: actions/checkout@v7
    - name: Install
      run: |
        sudo apt-get update -y
        sudo apt-get install -y libhwloc-dev
    - name: Before script
      run: |
        sed -i 's/^CFLAGS = .*/CFLAGS = -std=gnu99 -Wall -Wextra -g -Og -fsanitize=thread/' makemake.sh
        $CC --version
    - name: Script
      run: |
        set -x -o pipefail
        bash -e -o pipefail -- makemake.sh use_hwloc nosimd
        cd obj_nosimd
        make clean
        time ./Mlucas -s tt -cpu "0:$(( $(nproc --all) - 1 ))" |& tee -a test.log
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: linux_${{ matrix.cc }}_tsan_mlucas
        path: |
