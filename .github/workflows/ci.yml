name: CI
on:
  push:
    branches:
      - main
  pull_request:
    # Skip the matrix for changes that cannot affect any build or test. pull_request only:
    # pushes to main and the monthly schedule always run everything. A denylist rather than
    # an allowlist, so an unrecognised new file type still runs CI rather than silently not.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - 'help.txt'
  schedule:
    - cron:  '0 0 1 * *'

# One run per ref. A pull_request run is superseded the moment its branch is pushed again, but
# without a concurrency group the old run keeps its runners until it finishes on its own - and a run
# is 74 jobs and ~1734 runner-minutes against a pool that peaks at 12 concurrent jobs, about 4 of
# them macOS and that macOS cap is account-wide rather than per run. A queued job expires if it has
# not started within 24 hours, so runners held by a run nobody is waiting for are not just waste:
# they push live jobs past the point where they will ever start.
#
# Pushes to main and the monthly schedule are deliberately not cancelled - those runs are the record
# of what the branch does, and a later push should not erase an earlier result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  Linux:
    name: Mlucas Linux

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04, ubuntu-22.04-arm, ubuntu-24.04-arm, ubuntu-26.04-arm]
        cc: [gcc, clang]
      fail-fast: false
    env:
      CC: ${{ matrix.cc }}
    steps:
    - uses: actions/checkout@v7
    - name: Install
      run: |
        sudo apt-get update -y
        sudo apt-get install -y libhwloc-dev
    - name: Before script
      run: |
        $CC --version
        if [[ $HOSTTYPE == aarch64 ]]; then
            $CC -dM -E -mcpu=native - </dev/null
        else
            $CC -dM -E -march=native - </dev/null
        fi
    - name: Script
      run: |
        set -x
        set -o pipefail
        lscpu
        cat /proc/cpuinfo
        MODES=( '' NOSIMD )
        if [[ $HOSTTYPE == aarch64 ]]; then
            MODES+=( ASIMD )
        else
            MODES+=( SSE2 AVX AVX2 AVX512 )
            if echo 'int main(void){return 0;}' | $CC -march=knl -mavx512f -mavx512er -x c -o /dev/null -; then
                MODES+=( AVX512_KNL )
            else
                echo "::warning::Skipping the AVX512_KNL build mode as '$($CC --version | head -n1)' does not support -march=knl."
            fi
        fi
        for mode in "${MODES[@]}"; do
            echo -e "\n$mode\n"
            bash -e -o pipefail -- makemake.sh use_hwloc $mode
            (cd obj${mode:+_$mode}; make clean)
            for word in '' 1word 2word 3word 4word nword; do
                echo -e "\nMfactor $word\n"
                bash -e -o pipefail -- makemake.sh mfac $word $mode
                (
                    cd obj_mfac${word:+_$word}${mode:+_$mode}
                    make clean
                )
            done
        done
        cd obj
        echo -e '## Warnings\n```' >> $GITHUB_STEP_SUMMARY
        grep 'warning:' build.log | sed 's/\x1B\[\([0-9]\+\(;[0-9]\+\)*\)\?[mK]//g' | awk '{ print $NF }' | sort | uniq -c | sort -nr >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        # Ladder stops at 'm'. The 'l' self-test (FFT lengths 8M-60M) ran here on every push and
        # every pull request and was ~90% of this job's self-test time; it now runs weekly against
        # main in selftest-large.yml, and on demand via that workflow's workflow_dispatch.
        # Self-test exit status: 1 = a wrong answer (residue mismatch, radix-set disagreement or a
        # zero residue); 2 = some FFT length had too few usable radix sets to test at all. Both used
        # to be 0, so no self-test regression could turn this job red. Gate on 1 for now - status 2
        # still fires on a stock build at 1K and 2K - and tighten to (( rc == 0 )) once those are fixed.
        rc=0
        for s in tt t s m; do
            st=0
            time ./Mlucas -s $s -cpu "0:$(( $(nproc --all) - 1 ))" |& tee -a test.log
            st=${PIPESTATUS[0]}
            if (( st == 1 )); then rc=1; fi
        done
        for s in tt t s; do
            st=0
            time ./Mlucas -prp -s $s -cpu "0:$(( $(nproc --all) - 1 ))" |& tee -a test.log
            st=${PIPESTATUS[0]}
            if (( st == 1 )); then rc=1; fi
        done
        (( rc == 0 ))
        if [[ $HOSTTYPE == aarch64 ]]; then
            cd ../obj_NOSIMD
        fi
        bash -e -o pipefail -- ../config-fermat.sh -cpu "0:$(( $(nproc --all) - 1 ))"
        # Mfactor self-test on one build only. The explicit-ISA builds above are for compile
        # coverage: a runner may not be able to execute what they target.
        # On ARM the native build is ASIMD, whose trial-factoring routines are stubs -
        # twopmodq80.c's "No TF support on ARMv8!" lives under #ifdef USE_ARM_V8_SIMD - so run
        # the NOSIMD build there instead, which takes the scalar TF path and self-tests normally.
        # Same substitution config-fermat.sh already makes above, and the loop above has already
        # built these, so it costs no extra build time.
        if [[ $HOSTTYPE == aarch64 || $HOSTTYPE == arm64 ]]; then MSFX=_NOSIMD; else MSFX=; fi
        for word in '' 1word 2word 3word 4word nword; do
            # M(521), not M(127): the 4-word build's 256-bit modpow needs p + 256 >= 512 to have a
            # lead chunk to work with, and asserts ("twopmodq256 : start_index < 2!") below that.
            # M(127) only ever passed because a stray -DTRYQ=4 sent that build down the single-word
            # path instead. 521 is the smallest Mersenne-prime exponent every word variant handles,
            # and costs slightly less than 127 did (726k trial divides vs 1.66M).
            ( cd "../obj_mfac${word:+_$word}${MSFX}" && time "./Mfactor${word:+_$word}" -m 521 -bmax 20 )
        done
    - name: Jacobi / Gerbicz error-check tests
      run: |
        set -x
        set -o pipefail
        # A second native build with the test-only fault injector compiled in (see tests/jacobi-check.sh
        # for what it is used for). The native obj/ Makefile is reused with one extra define; its objects
        # were cleaned above, so this is a full compile of the native mode.
        mkdir obj_fi
        sed 's/^CPPFLAGS += /CPPFLAGS += -DMLUCAS_FAULT_INJECT /' obj/Makefile > obj_fi/Makefile
        make -C obj_fi -j "$(nproc --all)" Mlucas
        JACOBI_TEST_CPU="0:$(( $(nproc --all) - 1 ))" JACOBI_TEST_DIR="$PWD/obj/jacobi-tests" \
            time bash tests/jacobi-check.sh obj/Mlucas obj_fi/Mlucas obj/mlucas.cfg |& tee -a obj/test.log
        JACOBI_TEST_CPU="0:$(( $(nproc --all) - 1 ))" JACOBI_TEST_DIR="$PWD/obj/jacobi-pm1-tests" \
            time bash tests/jacobi-pm1.sh obj/Mlucas obj_fi/Mlucas obj/mlucas.cfg |& tee -a obj/test.log
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: ${{ matrix.os }}_${{ matrix.cc }}_mlucas
        path: |
          obj*/build.log
          obj*/test.log
          obj*/mlucas.cfg
        if-no-files-found: warn

  Singlethread-Linux:
    name: Mlucas Singlethreaded Linux

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        cc: [gcc]
      fail-fast: false
    env:
      CC: ${{ matrix.cc }}
    steps:
    - uses: actions/checkout@v7
    - name: Before script
      run: |
        sed -i 's/-DUSE_THREADS//' makemake.sh
        sed -i 's/^MAX=29/MAX=28/' config-fermat.sh
        $CC --version
    - name: Script
      run: |
        set -x
        MODES=( '' NOSIMD )
        if [[ $HOSTTYPE == aarch64 ]]; then
            MODES+=( ASIMD )
        else
            MODES+=( SSE2 AVX AVX2 AVX512 )
            if echo 'int main(void){return 0;}' | $CC -march=knl -mavx512f -mavx512er -x c -o /dev/null -; then
                MODES+=( AVX512_KNL )
            else
                echo "::warning::Skipping the AVX512_KNL build mode as '$($CC --version | head -n1)' does not support -march=knl."
            fi
        fi
        for mode in "${MODES[@]}"; do
            echo -e "\n$mode\n"
            bash -e -o pipefail -- makemake.sh $mode
            (cd obj${mode:+_$mode}; make clean)
            for word in '' 1word 2word 3word 4word nword; do
                echo -e "\nMfactor $word\n"
                bash -e -o pipefail -- makemake.sh mfac $word $mode
                (
                    cd obj_mfac${word:+_$word}${mode:+_$mode}
                    make clean
                )
            done
        done
        cd obj
        # Self-test exit status: 1 = a wrong answer (residue mismatch, radix-set disagreement or a
        # zero residue); 2 = some FFT length had too few usable radix sets to test at all. Both used
        # to be 0, so no self-test regression could turn this job red. Gate on 1 for now - status 2
        # still fires on a stock build at 1K and 2K - and tighten to (( rc == 0 )) once those are fixed.
        rc=0
        for s in tt t s m; do
            st=0
            time ./Mlucas -s $s || st=$?
            if (( st == 1 )); then rc=1; fi
        done
        for s in tt t s; do
            st=0
            time ./Mlucas -prp -s $s || st=$?
            if (( st == 1 )); then rc=1; fi
        done
        (( rc == 0 ))
        if [[ $HOSTTYPE == aarch64 ]]; then
            cd ../obj_NOSIMD
        fi
        bash -e -o pipefail -- ../config-fermat.sh
        # Mfactor self-test on one build only. The explicit-ISA builds above are for compile
        # coverage: a runner may not be able to execute what they target.
        # On ARM the native build is ASIMD, whose trial-factoring routines are stubs -
        # twopmodq80.c's "No TF support on ARMv8!" lives under #ifdef USE_ARM_V8_SIMD - so run
        # the NOSIMD build there instead, which takes the scalar TF path and self-tests normally.
        # Same substitution config-fermat.sh already makes above, and the loop above has already
        # built these, so it costs no extra build time.
        if [[ $HOSTTYPE == aarch64 || $HOSTTYPE == arm64 ]]; then MSFX=_NOSIMD; else MSFX=; fi
        for word in '' 1word 2word 3word 4word nword; do
            ( cd "../obj_mfac${word:+_$word}${MSFX}" && time "./Mfactor${word:+_$word}" -m 521 -bmax 20 )
        done
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: ${{ matrix.os }}_${{ matrix.cc }}_singlethreaded_mlucas
        path: |
          obj*/build.log
          obj*/test.log
          obj*/mlucas.cfg
        if-no-files-found: warn

  Linux-old:
    name: Mlucas Linux old

    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        container: ["ubuntu:14.04", "ubuntu:16.04", "ubuntu:18.04", "ubuntu:20.04", "alpine:3.8", "alpine:3.12", "alpine:3.16", "alpine:3.20", "alpine:3.24"]
        cc: [gcc, clang]
        exclude:
          # Ubuntu 14.04's clang (3.4-era) predates AArch64 NEON 'v'-register asm syntax, so it
          # cannot assemble the inline asm in dft_macro.c on ARM ("unknown register name 'v0'").
          # Its gcc builds fine there, as do both compilers on x86-64, so drop only this one combo.
          - os: ubuntu-24.04-arm
            container: "ubuntu:14.04"
            cc: clang
      fail-fast: false
    env:
      CC: ${{ matrix.cc }}
    steps:
    # - uses: actions/checkout@v7
    - name: Install
      if: ${{ startsWith(matrix.container, 'ubuntu:') }}
      run: |
        apt-get update
        DEBIAN_FRONTEND=noninteractive apt-get install -y wget build-essential libgmp-dev libhwloc-dev
        echo 'HAVE_HWLOC=1' >> "$GITHUB_ENV"
    - name: Install Clang
      if: ${{ startsWith(matrix.container, 'ubuntu:') && matrix.cc == 'clang' }}
      run: |
        apt-get install -y clang
    - name: Install
      if: ${{ startsWith(matrix.container, 'alpine:') }}
      run: |
        apk update
        apk add bash wget build-base gmp-dev
        if apk add hwloc-dev; then
            echo 'HAVE_HWLOC=1' >> "$GITHUB_ENV"
        fi
    - name: Install Clang
      if: ${{ startsWith(matrix.container, 'alpine:') && matrix.cc == 'clang' }}
      run: |
        apk add clang
    - name: Download
      run: |
        wget "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/archive/$GITHUB_SHA.tar.gz"
        tar -xzvf "$GITHUB_SHA.tar.gz" --strip-components=1
    - name: Before script
      run: |
        $CC --version
        ldd --version || true
    - name: Script
      shell: bash
      run: |
        set -x
        MODES=( '' NOSIMD )
        if [[ $HOSTTYPE == aarch64 ]]; then
            MODES+=( ASIMD )
        else
            MODES+=( SSE2 AVX AVX2 )
            # Only test the AVX-512 build mode if the compiler's assembler can handle the AVX-512 constructs
            # Mlucas's kernels use: the extended registers (zmm16-31/xmm16-31/k0-7). Ancient clang can't -
            # clang 3.8 (ubuntu:16.04) rejects the extended register names ("unknown register name 'xmm30'").
            # (The one AVX-512ER instruction, vrcp28pd, lived in an unused mi64.c routine and is now gated to
            # KNL-only via __AVX512ER__, so plain AVX-512 builds no longer need an ER-capable assembler -
            # which is why clang 5.0 on alpine:3.8 can now build AVX-512.) Probe and skip AVX-512 rather than
            # fail the build on a mode that provably can't work here.
            if echo 'int main(void){__asm__ __volatile__("vpxord %%zmm31,%%zmm31,%%zmm31\n\tvmovdqa64 %%xmm16,%%xmm17\n\tkmovw %%k1,%%eax":::"zmm31","xmm16","xmm17","k1","eax");return 0;}' | $CC -mavx512f -mavx512cd -mavx512dq -mavx512bw -mavx512vl -mfma -x c -o /dev/null -; then
                MODES+=( AVX512 )
            else
                echo "::warning::Skipping the AVX512 build mode as the '$($CC --version | head -n1)' assembler cannot handle the required AVX512 extended registers (zmm16-31/xmm16-31/k0-7)."
            fi
            if echo 'int main(void){__asm__ __volatile__("vpxord %%zmm31,%%zmm31,%%zmm31\n\tvmovdqa64 %%xmm16,%%xmm17\n\tkmovw %%k1,%%eax":::"zmm31","xmm16","xmm17","k1","eax");return 0;}' | $CC -march=knl -mavx512f -mavx512er -x c -o /dev/null -; then
                MODES+=( AVX512_KNL )
            else
                echo "::warning::Skipping the AVX512_KNL build mode as '$($CC --version | head -n1)' does not support -march=knl."
            fi
        fi
        for mode in "${MODES[@]}"; do
            echo -e "\n$mode\n"
            bash -e -o pipefail -- makemake.sh ${HAVE_HWLOC:+use_hwloc} $mode
            (cd obj${mode:+_$mode}; make clean)
            for word in '' 1word 2word 3word 4word nword; do
                echo -e "\nMfactor $word\n"
                bash -e -o pipefail -- makemake.sh mfac $word $mode
                (
                    cd obj_mfac${word:+_$word}${mode:+_$mode}
                    make clean
                )
            done
        done

  Linux-K1OM:
    name: Mlucas K1OM

    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Download
      run: |
          # https://web.archive.org/web/20210307201727/https://software.intel.com/content/www/us/en/develop/articles/intel-manycore-platform-software-stack-mpss.html
          wget -nv 'https://web.archive.org/web/20200818141734id_/http://registrationcenter-download.intel.com/akdlm/irc_nas/15904/mpss-3.8.6-linux.tar'
          tar -xvf mpss-3.8.6-linux.tar
    - name: Script
      run: |
        docker run --rm -i -v "$GITHUB_WORKSPACE:/workspace" -w /workspace centos:7 bash -s <<'EOF'
        set -e -o pipefail
        sed -i '/^mirrorlist/d;/^#baseurl=/{s|^#||;s|/mirror|/vault|;}' /etc/yum.repos.d/CentOS*.repo
        # yum update -y
        yum install -y make
        yum localinstall -y mpss-3.8.6/mpss-sdk-k1om-3.8.6-1.x86_64.rpm
        source /opt/mpss/3.8.6/environment-setup-k1om-mpss-linux

        export CC=k1om-mpss-linux-gcc
        unset CFLAGS CPPFLAGS
        $CC --version
        k1om-mpss-linux-ld --version
        $CC -dM -E - </dev/null

        bash -e -o pipefail -- makemake.sh no_gmp k1om
        (cd obj_k1om; make clean)
        for word in '' 1word 2word 3word 4word nword; do
            echo -e "\nMfactor $word\n"
            bash -e -o pipefail -- makemake.sh no_gmp mfac $word k1om
            (
                cd obj_mfac${word:+_$word}_k1om
                make clean
            )
        done
        EOF
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: linux_k1om_mlucas
        path: |
          obj*/build.log
          obj*/test.log
          obj*/mlucas.cfg
        if-no-files-found: warn

  Linux-KNL:
    name: Mlucas KNL

    # Pinned, not 'latest': GCC 13 is the last GCC that can target Knights Landing at all. GCC 14
    # accepts -march=knl but generates AVX512VL anyway, and GCC 15 removed the flag; makemake.sh
    # refuses both rather than emit a binary that dies on the first illegal instruction (see the
    # measured table there). 24.04 ships GCC 13 and Clang 18, both of which pass, so pin to it -
    # on a newer image this job would correctly but unhelpfully refuse to build.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        cc: [gcc, clang]
      fail-fast: false
    env:
      CC: ${{ matrix.cc }}
      # Intel SDE 9.38 and later removed the -knl/-knm knobs, and Intel no longer serves any
      # pre-9.38 build -- downloadmirror.intel.com returns 403 for 9.24, 9.27 and 9.33 alike.
      # 9.24.0 is therefore hosted as a release asset on this repository, byte-identical to
      # Intel's original and redistributed under the Intel Simplified Software License, which
      # permits redistribution without modification. See the ci-intel-sde-9.24.0 release.
      SDE_URL: https://github.com/primesearch/Mlucas/releases/download/ci-intel-sde-9.24.0/sde-external-9.24.0-2023-07-13-lin.tar.xz
      SDE_SHA256: 87a36b821d0fb8cbcbfeffa359753445f951b225b5f4747689ae16417c4f04ac
      SDE_DIR: sde-external-9.24.0-2023-07-13-lin
    steps:
    - uses: actions/checkout@v7
    - name: Install Intel SDE
      run: |
        curl -fsSL -o sde.tar.xz "$SDE_URL"
        # Verify before unpacking: the pin is what makes a hosted binary trustworthy.
        echo "$SDE_SHA256  sde.tar.xz" | sha256sum -c -
        mkdir -p "$SDE_DIR"
        tar -xf sde.tar.xz -C "$SDE_DIR" --strip-components=1
        rm -f sde.tar.xz
    - name: Before script
      run: |
        $CC --version
        "./$SDE_DIR/sde64" --version
    - name: Build
      run: |
        bash -e -o pipefail -- makemake.sh avx512_knl
        # Build Mfactor for KNL too - it has its own AVX-512 sieve, a distinct body of code from
        # Mlucas, so it is worth compile-covering here. Not run yet: under SDE it segfaults on a
        # tiny exponent because of the AVX-512 small-p sieve bug that #114 fixes. With #114 merged
        # in locally the same binary completes '-m 521 -bmax 20' cleanly, so the run step can be
        # added once that lands.
        bash -e -o pipefail -- makemake.sh mfac avx512_knl
    - name: Self-test under emulated Knights Landing
      run: |
        # -knl sets both CPUID and SDE's chip check, so any instruction outside the KNL ISA aborts
        # the run rather than silently working on the AVX-512 host. That is the point of this job:
        # an 'avx512' (Skylake-SP) build dies here on kmovd, which is exactly the regression to catch.
        #
        # Threads are worth using despite the emulator: measured under 'sde64 -knl', '-s t' takes
        # 810s on one core against 351s on four, a 2.3x speedup. ('-s tt' on its own shows almost
        # none, but it is short enough to be dominated by startup.) That is what makes 'tiny'
        # affordable here, and it roughly triples the FFT lengths covered: 16K-240K atop 2K-15K.
        cd obj_avx512_knl
        CPUS="0:$(( $(nproc --all) - 1 ))"
        # No pipe, so no pipefail needed and no knl.log: this job uploads no artifacts, and the
        # run's output goes to the workflow log either way.
        for s in tt t; do
          st=0
          "../$SDE_DIR/sde64" -knl -- ./Mlucas -s $s -cpu "$CPUS" || st=$?
          echo "Self-test -s $s exit status: $st"
          # 0 = ok, 2 = too few usable radix sets at some length (informational). Else fail.
          if (( st != 0 && st != 2 )); then exit "$st"; fi
        done

  ASan-Linux:
    name: AddressSanitizer Linux

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        cc: [gcc, clang]
      fail-fast: false
    env:
      CC: ${{ matrix.cc }}
    steps:
    - uses: actions/checkout@v7
    - name: Install
      run: |
        sudo apt-get update -y
        sudo apt-get install -y libhwloc-dev
    - name: Before script
      run: |
        sed -i 's/^CFLAGS = .*/CFLAGS = -std=gnu99 -Wall -g -Og -fsanitize=address,undefined/' makemake.sh
        sed -i 's/^MAX=29/MAX=28/' config-fermat.sh
        $CC --version
    - name: Script
      run: |
        set -x
        # On x86, build NOSIMD under the sanitizer (see PR #71 discussion): on macOS the SIMD asm
        # fails to assemble under -Og ("invalid CFI advance_loc expression"), and NOSIMD exercises
        # the same C-level logic. #221 picks the x86 SIMD coverage back up separately (AVX2
        # natively, AVX-512 under SDE).
        #
        # aarch64/Linux has no such assembler problem, so there the native (ASIMD) build is the one
        # to instrument - it is the only place in CI where hand-tuned SIMD asm gets built under a
        # sanitizer at all. Issue #12, a SEGV in radix48_dit_pass1 during 'Mlucas -s m', was
        # reported by ASan on an ARM runner, and with every sanitizer job pinned to NOSIMD there is
        # currently nothing left that could find its like.
        if [[ $HOSTTYPE == aarch64 ]]; then MODE=; else MODE=nosimd; fi
        bash -e -o pipefail -- makemake.sh use_hwloc $MODE
        (cd obj${MODE:+_$MODE}; make clean)
        # config-fermat.sh runs from the NOSIMD build on aarch64, as in the Linux job above, so
        # that build is needed there in addition to the ASIMD one:
        if [[ -z $MODE ]]; then
            bash -e -o pipefail -- makemake.sh use_hwloc nosimd
            (cd obj_nosimd; make clean)
        fi
        for word in '' 1word 2word 3word 4word nword; do
            echo -e "\nMfactor $word\n"
            bash -e -o pipefail -- makemake.sh mfac $word nosimd
            (cd obj_mfac${word:+_$word}_nosimd; make clean)
        done
        # Cheapest first, self-test ladder last. Measured on run 34702153019, this job's own log:
        # the '-s m' sweep is 42m20s of a 60-minute job, config-fermat.sh takes about a minute and
        # the Mfactor runs seconds apiece - and those two are where this job's findings have come
        # from, the radix1008 global-buffer-overflow and the Mfactor leaks. Running the ladder last
        # means a real sanitizer report lands in minutes rather than behind a 42-minute sweep.
        # Nothing here depends on the ladder having run: config-fermat.sh computes its own FFT
        # lengths from a table and never reads mlucas.cfg.
        cd obj${MODE:+_$MODE}
        # Guard against the ARM cell silently degrading into a second copy of the x86 one if
        # auto-detection ever changes: makemake.sh announces the selected mode on stdout but does
        # not record it in build.log, so ask the binary itself what it was built as.
        if [[ -z $MODE ]]; then
            ./Mlucas -s tt -cpu 0 > mode.log 2>&1
            grep -q 'Build uses ARMv8 advanced-SIMD' mode.log || {
                echo '::error::ARM cell is not an ASIMD build - it would be testing nothing'; exit 1; }
        fi
        # On ARM the native build is ASIMD, whose trial-factoring routines are stubs
        # ("No TF support on ARMv8!" in twopmodq80.c, under #ifdef USE_ARM_V8_SIMD), so
        # config-fermat.sh and the Mfactor self-tests run from the NOSIMD builds - the same
        # substitution the Linux and Singlethread-Linux jobs make.
        cd ../obj_nosimd
        bash -e -o pipefail -- ../config-fermat.sh -cpu "0:$(( $(nproc --all) - 1 ))"
        for word in '' 1word 2word 3word 4word nword; do
            ( cd "../obj_mfac${word:+_$word}_nosimd" && time "./Mfactor${word:+_$word}" -m 521 -bmax 20 )
        done
        # Back to the build under test for the self-test ladder, which runs last (see above):
        cd ../obj${MODE:+_$MODE}
        # Self-test exit status: 1 = a wrong answer (residue mismatch, radix-set disagreement or a
        # zero residue); 2 = some FFT length had too few usable radix sets to test at all. Both used
        # to be 0, so no self-test regression could turn this job red. Gate on 1 for now - status 2
        # still fires on a stock build at 1K and 2K - and tighten to (( rc == 0 )) once those are fixed.
        rc=0
        for s in tt t s m; do
            st=0
            time ./Mlucas -s $s -cpu "0:$(( $(nproc --all) - 1 ))" || st=$?
            if (( st == 1 )); then rc=1; fi
        done
        for s in tt t s; do
            st=0
            time ./Mlucas -prp -s $s -cpu "0:$(( $(nproc --all) - 1 ))" || st=$?
            if (( st == 1 )); then rc=1; fi
        done
        (( rc == 0 ))
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: ${{ matrix.os }}_${{ matrix.cc }}_asan_mlucas
        path: ${{ github.workspace }}

  ASan-SIMD-Linux:
    name: AddressSanitizer SIMD Linux

    # Deterministic, blocking, residue-checked AddressSanitizer coverage of the SIMD builds -
    # the hand-written inline-asm kernels, which are where Mlucas's arithmetic actually lives.
    #
    # Not redundant with the ASan-Linux job above, on four counts. That job invokes makemake.sh
    # with no mode argument, so it builds whatever /proc/cpuinfo reports plus -march=native:
    # which SIMD mode gets sanitized is a property of the runner SKU, not of this file. It is
    # wrapped in continue-on-error, so it cannot fail. Its check is ./Mlucas -s m, whose verdict
    # is discarded - the self-test's DONE: path returns 0 unconditionally, so -s always exits 0
    # even when it prints "PLEASE CHECK YOUR BUILD OPTIONS". And its gcc leg does not currently
    # compile at all on an AVX2-or-better host, which continue-on-error hides. This job pins the
    # mode, has no continue-on-error, and asserts residues.
    #
    # The AVX-512 leg runs under Intel SDE rather than on the runner CPU, because otherwise it
    # cannot run at all: GitHub's Azure runner SKUs are inconsistent about AVX-512. Note that
    # the Mlucas Linux job above *builds* AVX512 but then runs its self-tests out of obj/, the
    # auto-detected build - so as things stand no job in this workflow ever executes an
    # explicitly-AVX-512 binary, and whether AVX-512 code runs at all depends on which SKU the
    # job landed on. SDE removes that dependency entirely.
    #
    # There is deliberately no continue-on-error here: a masked sanitizer job is
    # indistinguishable from a job that does not exist, which is how the ASan jobs in this
    # workflow stayed dead behind a build break for years.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        cc: [gcc, clang]
      fail-fast: false
    env:
      CC: ${{ matrix.cc }}
      # Pinned and checksummed on purpose: with a floating "latest" download, an emulator
      # change would surface as an unexplained residue mismatch.
      #
      # Hosted here rather than fetched from Intel. Intel prunes old releases -- 9.24, 9.27 and
      # 9.33 all return 403 from downloadmirror.intel.com today -- so an upstream pin is a build
      # break waiting to happen. This asset is byte-identical to Intel's original, redistributed
      # under the Intel Simplified Software License, which permits redistribution unmodified.
      #
      # 9.24.0 rather than a later kit because it is the last one that still has -knl/-knm, which
      # the KNL job needs; using one version everywhere keeps a single asset and a single hash.
      # Verified equivalent for this job's purposes: the teensy and tiny self-tests of an AVX-512
      # build under -skx give identical residues on 9.24 and 9.53 (75 residues compared over the
      # two stages), with mlucas.cfg matching apart from the msec/iter timing column.
      SDE_URL: https://github.com/primesearch/Mlucas/releases/download/ci-intel-sde-9.24.0/sde-external-9.24.0-2023-07-13-lin.tar.xz
      SDE_SHA256: 87a36b821d0fb8cbcbfeffa359753445f951b225b5f4747689ae16417c4f04ac
    steps:
    - uses: actions/checkout@v7
    - name: Install Intel SDE
      run: |
        set -x
        curl -fsSL -o sde.tar.xz "$SDE_URL"
        echo "$SDE_SHA256  sde.tar.xz" | sha256sum -c -
        mkdir -p "$HOME/sde"
        tar -xf sde.tar.xz -C "$HOME/sde" --strip-components=1
        rm -f sde.tar.xz
        "$HOME/sde/sde64" -version
    - name: Before script
      run: |
        $CC --version
        # -O3, not the -Og used by the ASan-Linux job above: the undeclared-inline-asm-clobber
        # defects this job exists to catch only appear once the compiler is actually keeping
        # live values in registers across the asm blocks.
        #
        # address only, not address,undefined: UBSan's instrumentation duplicates asm blocks that
        # carry hard-coded local labels, and clang then fails with
        #   src/mi64.c:7353: error: symbol 'loop2d' is already defined
        # at -O3 in the SIMD modes. UBSan coverage of these kernels needs those labels made unique
        # first; plain -fsanitize=address builds clean on both compilers and both modes.
        #
        # NOT -fsanitize-recover=address. It is not a neutral convenience flag: adding it, and
        # nothing else, makes a tree with the AVX-512 clobber defects produce *correct* results,
        # so it disables the very thing this job checks. See .github/scripts/asan-simd-check.sh.
        # Both legs get full instrumentation. gcc formerly needed --param asan-stack=0 here: the
        # over-declared 14-GPR clobber lists in sse2_macro_gcc64.h left ASan's stack instrumentation
        # no register to reserve, and the build died with "'asm' operand has impossible constraints"
        # (4 such errors at AVX2, 6 at AVX-512). That was a source defect rather than a gcc
        # limitation, and it has since been fixed on main, so the workaround - and the
        # stack-buffer-overflow / use-after-return / use-after-scope blind spot it created - is gone.
        CFLAGS="-fdiagnostics-color -Wall -g -O3 -std=gnu99 -fsanitize=address -fno-omit-frame-pointer"
        echo "CFLAGS=$CFLAGS" >> "$GITHUB_ENV"
        echo "LDFLAGS=-fsanitize=address" >> "$GITHUB_ENV"
    - name: AVX2
      run: bash -- .github/scripts/asan-simd-check.sh avx2
    - name: AVX-512 under Intel SDE
      # Runs even if the AVX2 leg failed: the AVX-512 leg is the one that covers the
      # AVX-512-only clobber defects, and it must not be masked by an unrelated AVX2 failure.
      if: ${{ !cancelled() }}
      run: bash -- .github/scripts/asan-simd-check.sh avx512 "$HOME/sde/sde64" -skx --

  TSan-Linux:
    name: ThreadSanitizer Linux

    runs-on: ubuntu-latest
    strategy:
      matrix:
        cc: [gcc, clang]
        exclude:
          - cc: gcc # Too slow
      fail-fast: false
    env:
      CC: ${{ matrix.cc }}
    steps:
    - uses: actions/checkout@v7
    - name: Install
      run: |
        sudo apt-get update -y
        sudo apt-get install -y libhwloc-dev
    - name: Before script
      run: |
        sed -i 's/^CFLAGS = .*/CFLAGS = -std=gnu99 -Wall -g -Og -fsanitize=thread/' makemake.sh
        $CC --version
    - name: Script
      run: |
        set -x
        bash -e -o pipefail -- makemake.sh use_hwloc
        cd obj
        make clean
        time ./Mlucas -s m -cpu "0:$(( $(nproc --all) - 1 ))"
      continue-on-error: true

  GCC-analyzer:
    name: GCC analyzer

    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: GCC analyzer
      run: |
        set -x
        set -o pipefail
        gcc -c -fdiagnostics-color -std=gnu99 -g -O3 -march=native -DUSE_THREADS -fanalyzer src/*.c |& tee analyzer.log
        rm -- *.o
        echo -e '## GCC analyzer\n```' >> $GITHUB_STEP_SUMMARY
        grep 'warning:' analyzer.log | sed 's/\x1B\[\([0-9]\+\(;[0-9]\+\)*\)\?[mK]//g' | awk '{ print $NF }' | sort | uniq -c | sort -nr >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY

  Clang-Tidy:
    name: Clang-Tidy

    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install
      run: |
        sudo apt-get update -y
        sudo apt-get install -y libhwloc-dev
    - name: Clang-Tidy
      run: |
        set -x
        set -o pipefail
        clang-tidy --use-color -checks='bugprone-*,-bugprone-reserved-identifier,cert-*,clang-analyzer-*,concurrency-*,misc-*,-misc-no-recursion,-misc-confusable-identifiers,performance-*,portability-*,readability-const-return-type,readability-container-*,readability-duplicate-include,readability-else-after-return,readability-make-member-function-cons,readability-non-const-parameter,readability-redundant-*,readability-simplify-*,readability-string-compare,readability-use-*' -header-filter='.*' src/*.c -- -std=gnu99 -Wall -O3 -march=native -DUSE_THREADS -DINCLUDE_HWLOC=1 |& tee clang-tidy.log
        echo -e '## Clang-Tidy\n```' >> $GITHUB_STEP_SUMMARY
        grep 'warning:' clang-tidy.log | sed 's/\x1B\[\([0-9]\+\(;[0-9]\+\)*\)\?[mK]//g' | awk '{ print $NF }' | sort | uniq -c | sort -nr >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY

  Cppcheck:
    name: Cppcheck

    runs-on: ubuntu-22.04 # ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install
      run: |
        sudo apt-get update -y
        sudo apt-get install -y cppcheck libhwloc-dev
    - name: Cppcheck
      run: |
        mkdir build
        cppcheck --std=c99 --enable=all -DUSE_THREADS -DINCLUDE_HWLOC=1 --force --cppcheck-build-dir=build -j "$(nproc)" --clang .
        cppcheck --std=c99 --enable=all -DUSE_THREADS -DINCLUDE_HWLOC=1 --force --cppcheck-build-dir=build --clang . &> cppcheck.log
        echo -e '## Cppcheck\n```' >> $GITHUB_STEP_SUMMARY
        grep '\(error\|warning\|style\|performance\|portability\|information\):' cppcheck.log | awk '{ print $2, $NF }' | sort | uniq -c | sort -nr >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY

  ShellCheck:
    name: ShellCheck

    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: ShellCheck
      run: shellcheck --version; shopt -s globstar; shellcheck -o avoid-nullary-conditions,deprecate-which,quote-safe-variables,require-double-brackets -s bash **/*.sh

  Inline-asm-clobbers:
    name: Inline-asm clobber lint

    # Flags x86 inline-asm blocks that use a hard register which is neither bound
    # to an operand nor declared clobbered. The compiler is then free to keep a
    # live value in that register across the asm, and the asm destroys it -- a
    # wrong residue or a SIGSEGV that reads as a compiler bug. Five instances have
    # been found in this tree, four of them first misdiagnosed as gcc/clang codegen
    # defects.
    #
    # No sanitizer can see this class: there is no C-level operation to instrument,
    # and the instrumentation perturbs register allocation enough that the symptom
    # often disappears. A static check is the only thing that catches it.
    #
    # main is currently clean, so there is no baseline file and any finding fails
    # the job. If a finding ever has to be accepted, record it with
    #     python3 asm-clobber-lint.py --write-baseline
    # which writes asm-clobber-baseline.txt; the job then fails only on findings
    # outside that file.
    #
    # Deliberately no 'continue-on-error' and no pipe into 'tee': a CI job that
    # cannot fail is not a CI job.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Self-test
      run: python3 asm-clobber-lint.py --self-test
    - name: Registers used vs registers declared
      run: python3 asm-clobber-lint.py --jobs "$(nproc)"

  macOS:
    name: Mlucas macOS

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-14, macos-15-intel, macos-15, macos-26-intel, macos-26]
      fail-fast: false
    steps:
    - uses: actions/checkout@v7
    - name: Install
      run: |
        brew install hwloc
    - name: Before script
      run: |
        clang --version
        if [[ $HOSTTYPE == arm64 ]]; then
            clang -dM -E -mcpu=native - </dev/null
        else
            clang -dM -E -march=native - </dev/null
        fi
    - name: Script
      run: |
        set -x
        set -o pipefail
        sysctl -a
        MODES=( '' NOSIMD )
        if [[ $HOSTTYPE == arm64 ]]; then
            MODES+=( ASIMD )
        else
            MODES+=( SSE2 AVX AVX2 AVX512 )
        fi
        for mode in "${MODES[@]}"; do
            echo -e "\n$mode\n"
            bash -e -o pipefail -- makemake.sh use_hwloc $mode
            (cd obj${mode:+_$mode}; make clean)
            for word in '' 1word 2word 3word 4word nword; do
                echo -e "\nMfactor $word\n"
                bash -e -o pipefail -- makemake.sh mfac $word $mode
                (
                    cd obj_mfac${word:+_$word}${mode:+_$mode}
                    make clean
                )
            done
        done
        cd obj
        echo -e '## Warnings\n```' >> $GITHUB_STEP_SUMMARY
        grep 'warning:' build.log | sed 's/\x1B\[\([0-9]\+\(;[0-9]\+\)*\)\?[mK]//g' | grep -v '^ld:' | awk '{ print $NF }' | sort | uniq -c | sort -nr >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        # Ladder stops at 'm'; 'l' runs weekly against main in selftest-large.yml. See the note in
        # the Linux job above.
        # Self-test exit status: 1 = a wrong answer (residue mismatch, radix-set disagreement or a
        # zero residue); 2 = some FFT length had too few usable radix sets to test at all. Both used
        # to be 0, so no self-test regression could turn this job red. Gate on 1 for now - status 2
        # still fires on a stock build at 1K and 2K - and tighten to (( rc == 0 )) once those are fixed.
        rc=0
        for s in tt t s m; do
            st=0
            time ./Mlucas -s $s -cpu "0:$(( $(sysctl -n hw.ncpu) - 1 ))" 2>&1 | tee -a test.log
            st=${PIPESTATUS[0]}
            if (( st == 1 )); then rc=1; fi
        done
        for s in tt t s; do
            st=0
            time ./Mlucas -prp -s $s -cpu "0:$(( $(sysctl -n hw.ncpu) - 1 ))" 2>&1 | tee -a test.log
            st=${PIPESTATUS[0]}
            if (( st == 1 )); then rc=1; fi
        done
        (( rc == 0 ))
        if [[ $HOSTTYPE == arm64 ]]; then
            cd ../obj_NOSIMD
        fi
        bash -e -o pipefail -- ../config-fermat.sh -cpu "0:$(( $(sysctl -n hw.ncpu) - 1 ))"
        # Mfactor self-test on one build only. The explicit-ISA builds above are for compile
        # coverage: a runner may not be able to execute what they target.
        # On ARM the native build is ASIMD, whose trial-factoring routines are stubs -
        # twopmodq80.c's "No TF support on ARMv8!" lives under #ifdef USE_ARM_V8_SIMD - so run
        # the NOSIMD build there instead, which takes the scalar TF path and self-tests normally.
        # Same substitution config-fermat.sh already makes above, and the loop above has already
        # built these, so it costs no extra build time.
        if [[ $HOSTTYPE == aarch64 || $HOSTTYPE == arm64 ]]; then MSFX=_NOSIMD; else MSFX=; fi
        for word in '' 1word 2word 3word 4word nword; do
            ( cd "../obj_mfac${word:+_$word}${MSFX}" && time "./Mfactor${word:+_$word}" -m 521 -bmax 20 )
        done
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: ${{ matrix.os }}_mlucas
        path: |
          obj*/build.log
          obj*/test.log
          obj*/mlucas.cfg
        if-no-files-found: warn

  Singlethread-macOS:
    name: Mlucas Singlethreaded macOS

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-26-intel, macos-latest]
      fail-fast: false
    steps:
    - uses: actions/checkout@v7
    - name: Before script
      run: |
        sed -i '' 's/-DUSE_THREADS//' makemake.sh
        sed -i '' 's/^MAX=29/MAX=28/' config-fermat.sh
        clang --version
    - name: Script
      run: |
        set -x
        MODES=( '' NOSIMD )
        if [[ $HOSTTYPE == arm64 ]]; then
            MODES+=( ASIMD )
        else
            MODES+=( SSE2 AVX AVX2 AVX512 )
        fi
        for mode in "${MODES[@]}"; do
            echo -e "\n$mode\n"
            bash -e -o pipefail -- makemake.sh $mode
            (cd obj${mode:+_$mode}; make clean)
            for word in '' 1word 2word 3word 4word nword; do
                echo -e "\nMfactor $word\n"
                bash -e -o pipefail -- makemake.sh mfac $word $mode
                (
                    cd obj_mfac${word:+_$word}${mode:+_$mode}
                    make clean
                )
            done
        done
        cd obj
        # Self-test exit status: 1 = a wrong answer (residue mismatch, radix-set disagreement or a
        # zero residue); 2 = some FFT length had too few usable radix sets to test at all. Both used
        # to be 0, so no self-test regression could turn this job red. Gate on 1 for now - status 2
        # still fires on a stock build at 1K and 2K - and tighten to (( rc == 0 )) once those are fixed.
        rc=0
        for s in tt t s m; do
            st=0
            time ./Mlucas -s $s || st=$?
            if (( st == 1 )); then rc=1; fi
        done
        for s in tt t s; do
            st=0
            time ./Mlucas -prp -s $s || st=$?
            if (( st == 1 )); then rc=1; fi
        done
        (( rc == 0 ))
        if [[ $HOSTTYPE == arm64 ]]; then
            cd ../obj_NOSIMD
        fi
        bash -e -o pipefail -- ../config-fermat.sh
        # Mfactor self-test on one build only. The explicit-ISA builds above are for compile
        # coverage: a runner may not be able to execute what they target.
        # On ARM the native build is ASIMD, whose trial-factoring routines are stubs -
        # twopmodq80.c's "No TF support on ARMv8!" lives under #ifdef USE_ARM_V8_SIMD - so run
        # the NOSIMD build there instead, which takes the scalar TF path and self-tests normally.
        # Same substitution config-fermat.sh already makes above, and the loop above has already
        # built these, so it costs no extra build time.
        if [[ $HOSTTYPE == aarch64 || $HOSTTYPE == arm64 ]]; then MSFX=_NOSIMD; else MSFX=; fi
        for word in '' 1word 2word 3word 4word nword; do
            ( cd "../obj_mfac${word:+_$word}${MSFX}" && time "./Mfactor${word:+_$word}" -m 521 -bmax 20 )
        done
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: ${{ matrix.os }}_singlethreaded_mlucas
        path: |
          obj*/build.log
          obj*/test.log
          obj*/mlucas.cfg
        if-no-files-found: warn

  ASan-macOS:
    name: AddressSanitizer macOS

    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install
      run: |
        brew install hwloc
    - name: Before script
      run: |
        sed -i '' 's/^CFLAGS = .*/CFLAGS = -std=gnu99 -Wall -g -Og -fsanitize=address,undefined/' makemake.sh
        sed -i '' 's/^MAX=29/MAX=28/' config-fermat.sh
        clang --version
    - name: Script
      run: |
        set -x
        # Build NOSIMD under the sanitizer (see PR #71 discussion): testing the hand-tuned
        # SIMD asm under ASan/UBSan adds little, and on macOS it fails to assemble under -Og
        # ("invalid CFI advance_loc expression"). NOSIMD exercises the same C-level logic.
        bash -e -o pipefail -- makemake.sh use_hwloc nosimd
        (cd obj_nosimd; make clean)
        for word in '' 1word 2word 3word 4word nword; do
            echo -e "\nMfactor $word\n"
            bash -e -o pipefail -- makemake.sh mfac $word nosimd
            (cd obj_mfac${word:+_$word}_nosimd; make clean)
        done
        cd obj_nosimd
        # Cheapest first, self-test ladder last - see the note in the Linux sanitizer job above.
        # Self-test exit status: 1 = a wrong answer (residue mismatch, radix-set disagreement or a
        # zero residue); 2 = some FFT length had too few usable radix sets to test at all. Both used
        # to be 0, so no self-test regression could turn this job red. Gate on 1 for now - status 2
        # still fires on a stock build at 1K and 2K - and tighten to (( rc == 0 )) once those are fixed.
        rc=0
        for s in tt t s m; do
            st=0
            time ./Mlucas -s $s -cpu "0:$(( $(sysctl -n hw.ncpu) - 1 ))" || st=$?
            if (( st == 1 )); then rc=1; fi
        done
        for s in tt t s; do
            st=0
            time ./Mlucas -prp -s $s -cpu "0:$(( $(sysctl -n hw.ncpu) - 1 ))" || st=$?
            if (( st == 1 )); then rc=1; fi
        done
        (( rc == 0 ))
        bash -e -o pipefail -- ../config-fermat.sh -cpu "0:$(( $(sysctl -n hw.ncpu) - 1 ))"
        for word in '' 1word 2word 3word 4word nword; do
            ( cd "../obj_mfac${word:+_$word}_nosimd" && time "./Mfactor${word:+_$word}" -m 521 -bmax 20 )
        done
        for s in tt t s; do time ./Mlucas -prp -s $s -cpu "0:$(( $(sysctl -n hw.ncpu) - 1 ))"; done
        for s in tt t s m; do time ./Mlucas -s $s -cpu "0:$(( $(sysctl -n hw.ncpu) - 1 ))"; done

  TSan-macOS:
    name: ThreadSanitizer macOS

    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install
      run: |
        brew install hwloc
    - name: Before script
      run: |
        sed -i '' 's/^CFLAGS = .*/CFLAGS = -std=gnu99 -Wall -g -Og -fsanitize=thread/' makemake.sh
        clang --version
    - name: Script
      run: |
        set -x
        bash -e -o pipefail -- makemake.sh use_hwloc
        cd obj
        make clean
        # Use the 'tt' (tiny) self-test rather than 'm': TSan's instrumentation is slow enough that the
        # medium tier timed out (this job was previously if:false-gated "Too slow"), whereas tt still
        # exercises the multithreaded carry/threadpool paths for data-race detection in a few seconds.
        time ./Mlucas -s tt -cpu "0:$(( $(sysctl -n hw.ncpu) - 1 ))"
      continue-on-error: true

  FreeBSD:
    name: Mlucas FreeBSD

    runs-on: ubuntu-latest
    strategy:
      matrix:
        release: [12, 13, 14, 15]
      fail-fast: false
    env:
      CC: clang
    steps:
    - uses: actions/checkout@v7
    - name: Script
      uses: vmactions/freebsd-vm@v1
      with:
        release: ${{ matrix.release }}
        envs: 'CC'
        usesh: true
        sync: nfs
        prepare: |
          set -e
          if [ "${{ matrix.release }}" = "12" ]; then
            cat >/etc/pkg/FreeBSD.conf <<'EOF'
          FreeBSD: {
            url: "https://mirror.sg.gs/freebsd-pkg/${ABI}/latest",
            mirror_type: "none",
            signature_type: "fingerprints",
            fingerprints: "/usr/share/keys/pkg",
            enabled: yes
          }
          EOF
            env PACKAGESITE='https://mirror.sg.gs/freebsd-pkg/FreeBSD:12:amd64/latest' /usr/sbin/pkg bootstrap -f -y
            pkg update -f
          fi
          pkg install -y bash gmp hwloc2
    - name: Before script
      shell: freebsd {0} 
      run: |
        set -e -o pipefail
        sed -i '' 's/^MAX=29/MAX=28/' config-fermat.sh
        $CC --version
        $CC -dM -E -march=native - </dev/null
    - name: Script
      shell: freebsd {0} 
      run: |
        set -ex -o pipefail
        sysctl -a
        for mode in '' NOSIMD SSE2 AVX AVX2 AVX512; do
          echo -e "\n$mode\n"
            bash -e -o pipefail -- makemake.sh use_hwloc $mode
            (cd obj${mode:+_$mode}; make clean)
            for word in '' 1word 2word 3word 4word nword; do
                echo -e "\nMfactor $word\n"
                bash -e -o pipefail -- makemake.sh mfac $word $mode
                (cd obj_mfac${word:+_$word}${mode:+_$mode}; make clean)
            done
        done
        cd obj
        # Self-test exit status: 1 = a wrong answer (residue mismatch, radix-set disagreement or a
        # zero residue); 2 = some FFT length had too few usable radix sets to test at all. Both used
        # to be 0, so no self-test regression could turn this job red. Gate on 1 for now - status 2
        # still fires on a stock build at 1K and 2K - and tighten to (( rc == 0 )) once those are fixed.
        rc=0
        for s in tt t s m; do
            st=0
            time ./Mlucas -s "$s" -cpu "0:$(( $(sysctl -n hw.ncpu) - 1 ))" | tee -a test.log
            st=${PIPESTATUS[0]}
            if (( st == 1 )); then rc=1; fi
        done
        (( rc == 0 ))
        bash -e -o pipefail -- ../config-fermat.sh -cpu "0:$(( $(sysctl -n hw.ncpu) - 1 ))"
        # Mfactor self-test on the native build only. The explicit-ISA builds above are for compile
        # coverage: this VM may not be able to execute what they target - running them per-mode is
        # what makes the AVX-512 binary SIGILL on three of the four releases on main today.
        for word in '' 1word 2word 3word 4word nword; do
            ( cd "../obj_mfac${word:+_$word}" && time "./Mfactor${word:+_$word}" -m 521 -bmax 20 )
        done
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: freebsd-${{ matrix.release }}-mlucas
        path: |
          obj*/build.log
          obj*/test.log
          obj*/mlucas.cfg
        if-no-files-found: warn

  Windows:
    name: Windows

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest]
        cc: [gcc, clang]
        include:
          - os: windows-11-arm
            cc: gcc
      fail-fast: false
    env:
      CC: ${{ matrix.cc }}
      PACKAGE_PREFIX: mingw-w64-${{ endsWith(matrix.os, '-arm') && 'clang-aarch64' || 'x86_64' }}-
    steps:
    - uses: actions/checkout@v7
    - name: Before Install
      run: |
        echo "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        echo "C:\msys64\usr\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        echo "CPPFLAGS=-IC:\msys64\mingw64\include" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        echo "LDFLAGS=-LC:\msys64\mingw64\lib" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
    - name: Install
      if: ${{ ! endsWith(matrix.os, '-arm') }}
      run: |
        pacman -S --noconfirm "${env:PACKAGE_PREFIX}gmp" "${env:PACKAGE_PREFIX}hwloc"
        & $env:CC --version
    - name: Install Clang
      if: ${{ matrix.cc == 'clang' }}
      run: |
        pacman -S --noconfirm "${env:PACKAGE_PREFIX}clang"
    - name: Before script
      shell: bash
      run: |
        $CC --version
        # The windows-11-arm runner ships no native aarch64 toolchain (no MSYS2/CLANGARM64), so its
        # "gcc" is really an x86_64-w64-mingw32 compiler running under emulation. Both $HOSTTYPE
        # (x86_64) and the matrix OS label (arm) mislead here, so key the arch off what the compiler
        # itself targets.
        #
        # This whole block only dumps predefined macros for the log, so it must not be able to fail
        # the job. On windows-11-arm the emulated compiler dies on the probe with 0x80000004 and takes
        # the step with it, before anything has been built - which is how that cell has been failing.
        {
            if [[ "$($CC -dM -E - </dev/null)" == *__aarch64__* ]]; then
                $CC -dM -E -mcpu=native - </dev/null
            else
                $CC -dM -E -march=native - </dev/null
            fi
        } || echo "::warning::predefined-macro probe failed; it is diagnostic only, continuing."
    - name: Script
      shell: bash
      run: |
        set -x
        MODES=( '' NOSIMD )
        # The windows-11-arm runner ships no native aarch64 toolchain, so its "gcc" actually targets
        # x86_64 (run under emulation); detect the arch the compiler targets rather than the matrix OS
        # label or $HOSTTYPE, both of which say the wrong thing on that runner:
        if [[ "$($CC -dM -E - </dev/null)" == *__aarch64__* ]]; then
            MODES+=( ASIMD )
        else
            MODES+=( SSE2 AVX AVX2 AVX512 )
        fi
        for mode in "${MODES[@]}"; do
            echo -e "\n$mode\n"
            bash -e -o pipefail -- makemake.sh ${{ endsWith(matrix.os, '-arm') && 'no_gmp' || 'use_hwloc' }} $mode
            (cd obj${mode:+_$mode}; make clean)
            for word in '' 1word 2word 3word 4word nword; do
                echo -e "\nMfactor $word\n"
                # The windows-11-arm runner has no GMP installed (the Install step is x86-only), so the
                # Mfactor build must also request no_gmp there, exactly as the main build above does:
                bash -e -o pipefail -- makemake.sh mfac ${{ endsWith(matrix.os, '-arm') && 'no_gmp' || '' }} $word $mode
                (cd obj_mfac${word:+_$word}${mode:+_$mode}; make clean)
            done
        done
        cd obj
        # Ladder stops at 'm'; 'l' runs weekly against main in selftest-large.yml. See the note in
        # the Linux job above.
        # Self-test exit status: 1 = a wrong answer (residue mismatch, radix-set disagreement or a
        # zero residue); 2 = some FFT length had too few usable radix sets to test at all. Both used
        # to be 0, so no self-test regression could turn this job red. Gate on 1 for now - status 2
        # still fires on a stock build at 1K and 2K - and tighten to (( rc == 0 )) once those are fixed.
        rc=0
        for s in tt t s m; do
            st=0
            time ./Mlucas -s $s -cpu "0:$(( NUMBER_OF_PROCESSORS - 1 ))" |& tee -a test.log
            st=${PIPESTATUS[0]}
            if (( st == 1 )); then rc=1; fi
        done
        for s in tt t s; do
            st=0
            time ./Mlucas -prp -s $s -cpu "0:$(( NUMBER_OF_PROCESSORS - 1 ))" |& tee -a test.log
            st=${PIPESTATUS[0]}
            if (( st == 1 )); then rc=1; fi
        done
        (( rc == 0 ))
        if [[ $HOSTTYPE == aarch64 ]]; then
            cd ../obj_NOSIMD
        fi
        bash -e -o pipefail -- ../config-fermat.sh -cpu "0:$(( NUMBER_OF_PROCESSORS - 1 ))"
        # Mfactor self-test on one build only. The explicit-ISA builds above are for compile
        # coverage; running them means executing a binary this runner may not support, which is
        # how the FreeBSD jobs came to SIGILL. Test the build matched to this host instead.
        # Same substitution config-fermat.sh already makes above, and the loop above has already
        # built these, so it costs no extra build time.
        if [[ $HOSTTYPE == aarch64 || $HOSTTYPE == arm64 ]]; then MSFX=_NOSIMD; else MSFX=; fi
        for word in '' 1word 2word 3word 4word nword; do
            ( cd "../obj_mfac${word:+_$word}${MSFX}" && time "./Mfactor${word:+_$word}" -m 521 -bmax 20 )
        done
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: ${{ matrix.os }}_${{ matrix.cc }}_mlucas
        path: |
          obj*/build.log
          obj*/test.log
          obj*/mlucas.cfg
        if-no-files-found: warn

  ASan-Windows:
    name: AddressSanitizer Windows

    runs-on: windows-latest
    env:
      CC: clang
      PACKAGE_PREFIX: mingw-w64-clang-x86_64-
    steps:
    - uses: actions/checkout@v7
    - name: Before Install
      run: |
        echo "C:\msys64\clang64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        echo "C:\msys64\usr\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        echo "CPPFLAGS=-IC:\msys64\clang64\include" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        echo "LDFLAGS=-LC:\msys64\clang64\lib" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
    - name: Install
      run: |
        pacman -S --noconfirm "${env:PACKAGE_PREFIX}toolchain"
        pacman -S --noconfirm "${env:PACKAGE_PREFIX}gmp" "${env:PACKAGE_PREFIX}hwloc"
    - name: Before script
      shell: bash
      run: |
        sed -i 's/^CFLAGS = .*/CFLAGS = -std=gnu99 -Wall -g -Og -fsanitize=address,undefined/' makemake.sh
        sed -i 's/^MAX=29/MAX=28/' config-fermat.sh
        $CC --version
    - name: Script
      shell: bash
      run: |
        set -x
        bash -e -o pipefail -- makemake.sh use_hwloc nosimd
        (cd obj_nosimd; make clean)
        for word in '' 1word 2word 3word 4word nword; do
            echo -e "\nMfactor $word\n"
            bash -e -o pipefail -- makemake.sh mfac $word nosimd
            (cd obj_mfac${word:+_$word}_nosimd; make clean)
        done
        cd obj_nosimd
        # Cheapest first, self-test ladder last - see the note in the Linux sanitizer job above.
        # Self-test exit status: 1 = a wrong answer (residue mismatch, radix-set disagreement or a
        # zero residue); 2 = some FFT length had too few usable radix sets to test at all. Both used
        # to be 0, so no self-test regression could turn this job red. Gate on 1 for now - status 2
        # still fires on a stock build at 1K and 2K - and tighten to (( rc == 0 )) once those are fixed.
        rc=0
        for s in tt t s m; do
            st=0
            time ./Mlucas -s $s -cpu "0:$(( NUMBER_OF_PROCESSORS - 1 ))" || st=$?
            if (( st == 1 )); then rc=1; fi
        done
        for s in tt t s; do
            st=0
            time ./Mlucas -prp -s $s -cpu "0:$(( NUMBER_OF_PROCESSORS - 1 ))" || st=$?
            if (( st == 1 )); then rc=1; fi
        done
        (( rc == 0 ))
        bash -e -o pipefail -- ../config-fermat.sh -cpu "0:$(( NUMBER_OF_PROCESSORS - 1 ))"
        for word in '' 1word 2word 3word 4word nword; do
            ( cd "../obj_mfac${word:+_$word}_nosimd" && time "./Mfactor${word:+_$word}" -m 521 -bmax 20 )
        done
        for s in tt t s; do time ./Mlucas -prp -s $s -cpu "0:$(( NUMBER_OF_PROCESSORS - 1 ))"; done
        for s in tt t s m; do time ./Mlucas -s $s -cpu "0:$(( NUMBER_OF_PROCESSORS - 1 ))"; done
