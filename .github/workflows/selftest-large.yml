name: Large self-test

# The 'large' (l) and 'huge' (h) self-tests: 16 exponents each, at FFT lengths 16M-60M and 64M-240M.
# ci.yml's ladders stop at 'm', so these are the only runs of the largest FFT lengths; 'h' had never
# been run in CI before this workflow. With the runners' 4 cores the self-test does 100 iterations
# per case (it switches to 1000 above 4 threads). Measured on 4 cores of a Zen 4 desktop (AVX2 build):
# 'm' 133 s, 'l' 396 s, 'h' 1943 s, so 'l' is about 3x 'm' and 'h' about 15x. On a runner, where 'm'
# takes ~4.8 minutes, that puts 'l' near 15 minutes and 'h' a little over an hour. 'h' peaks at about
# 9 GB of RAM: the Linux, Windows and FreeBSD jobs have room for it, but macos-latest has 7 GB, so the
# macOS job runs 'l' only.
#
# One job per OS, as in ci.yml, each building the native SIMD mode only: the explicit-ISA builds in
# ci.yml are for compile coverage, and what these jobs are for is running the largest lengths on
# whatever the runner actually executes.
on:
  schedule:
    # 1st of the month, 10:00 UTC. A scheduled run always uses the default branch, so this is main.
    - cron: '0 10 1 * *'
  workflow_dispatch:
  # Also run when this file changes, so a change to the workflow is checked before it next runs on
  # its own a month later.
  push:
    paths:
      - .github/workflows/selftest-large.yml
  pull_request:
    paths:
      - .github/workflows/selftest-large.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  Linux:
    name: Large self-test Linux

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
      fail-fast: false
    env:
      CC: gcc
    steps:
    - uses: actions/checkout@v7
    - name: Install
      run: |
        sudo apt-get update -y
        sudo apt-get install -y libhwloc-dev
    - name: Build
      run: |
        $CC --version
        bash -e -o pipefail -- makemake.sh use_hwloc
    - name: Self-test
      run: |
        cd obj
        # Exit status: 0 passes, and so does 2 - some length had too few usable radix sets in this
        # build, a property of the build rather than a wrong answer. Anything else, including a crash
        # part-way through, fails the job. '|| st=...' because the step runs under set -e.
        rc=0
        for s in l h; do
            st=0
            time ./Mlucas -s $s -cpu "0:$(( $(nproc --all) - 1 ))" |& tee -a test.log || st=${PIPESTATUS[0]}
            if (( st != 0 && st != 2 )); then rc=1; fi
        done
        (( rc == 0 ))
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: ${{ matrix.os }}_large_selftest
        path: |
          obj/test.log
          obj/mlucas.cfg
        if-no-files-found: warn

  macOS:
    name: Large self-test macOS

    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install
      run: |
        brew install hwloc
    - name: Build
      run: |
        clang --version
        bash -e -o pipefail -- makemake.sh use_hwloc
    - name: Self-test
      run: |
        cd obj
        # Same gate as the Linux job. 'l' only: 'h' needs ~9 GB and this runner has 7 GB.
        rc=0
        for s in l; do
            st=0
            time ./Mlucas -s $s -cpu "0:$(( $(sysctl -n hw.ncpu) - 1 ))" 2>&1 | tee -a test.log || st=${PIPESTATUS[0]}
            if (( st != 0 && st != 2 )); then rc=1; fi
        done
        (( rc == 0 ))
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: macos-latest_large_selftest
        path: |
          obj/test.log
          obj/mlucas.cfg
        if-no-files-found: warn

  Windows:
    name: Large self-test Windows

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            cc: gcc
          - os: windows-11-arm
            cc: clang
      fail-fast: false
    env:
      CC: ${{ matrix.cc }}
      PREFIX: ${{ endsWith(matrix.os, '-arm') && 'clangarm64' || 'mingw64' }}
      PACKAGE_PREFIX: mingw-w64-${{ endsWith(matrix.os, '-arm') && 'clang-aarch64' || 'x86_64' }}-
    steps:
    - uses: actions/checkout@v7
    - name: Before Install
      run: |
        echo "C:\msys64\${env:PREFIX}\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        echo "C:\msys64\usr\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        echo "CPPFLAGS=-IC:\msys64\${env:PREFIX}\include" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        echo "LDFLAGS=-LC:\msys64\${env:PREFIX}\lib" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
    - name: Install
      run: |
        pacman -S --noconfirm "${env:PACKAGE_PREFIX}gmp" "${env:PACKAGE_PREFIX}hwloc"
    - name: Install Clang
      if: ${{ matrix.cc == 'clang' }}
      run: |
        pacman -S --noconfirm "${env:PACKAGE_PREFIX}clang"
    - name: Build
      shell: bash
      run: |
        $CC --version
        bash -e -o pipefail -- makemake.sh use_hwloc
    - name: Self-test
      shell: bash
      run: |
        cd obj
        # Same gate as the Linux job.
        rc=0
        for s in l h; do
            st=0
            time ./Mlucas -s $s -cpu "0:$(( NUMBER_OF_PROCESSORS - 1 ))" |& tee -a test.log || st=${PIPESTATUS[0]}
            if (( st != 0 && st != 2 )); then rc=1; fi
        done
        (( rc == 0 ))
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: ${{ matrix.os }}_${{ matrix.cc }}_large_selftest
        path: |
          obj/test.log
          obj/mlucas.cfg
        if-no-files-found: warn

  FreeBSD:
    name: Large self-test FreeBSD

    runs-on: ubuntu-latest
    env:
      CC: clang
    steps:
    - uses: actions/checkout@v7
    - name: Self-test
      uses: vmactions/freebsd-vm@v1
      with:
        release: '15'
        cpu: 4
        mem: 12288
        envs: 'CC'
        usesh: true
        sync: nfs
        prepare: |
          pkg install -y bash gmp hwloc2
        run: |
          set -e -o pipefail
          $CC --version
          bash -e -o pipefail -- makemake.sh use_hwloc
          cd obj
          # Same gate as the Linux job, written for the VM's /bin/sh: no ${PIPESTATUS[n]} and no
          # (( ... )), so Mlucas writes to a file whose status is taken directly, and the file is
          # then shown and appended to test.log.
          rc=0
          for s in l h; do
              st=0
              time ./Mlucas -s "$s" -cpu "0:$(( $(sysctl -n hw.ncpu) - 1 ))" > selftest.out 2>&1 || st=$?
              tee -a test.log < selftest.out
              if [ "$st" -ne 0 ] && [ "$st" -ne 2 ]; then rc=1; fi
          done
          [ "$rc" -eq 0 ]
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: freebsd-15_large_selftest
        path: |
          obj/test.log
          obj/mlucas.cfg
        if-no-files-found: warn
